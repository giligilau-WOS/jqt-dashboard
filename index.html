<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>分隊工具</title><meta name="theme-color" content="#4338ca"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="分隊工具">
<style>
:root{--bg:#f2f3fa;--s1:#fff;--s2:#eceef8;--t1:#1b1f2e;--t2:#60667c;--bd:#dde0ee;--ac:#4f46e5;--acb:#ecebfd;--btxt:#fff;--wn:#9a5b00;--wnb:#fff1d0;--ok:#16793f;--okb:#dff5e7;--dg:#b3261e;--dgb:#fde7e5;--pu:#6a3fb5;--pub:#efe6fb;--sh:0 1px 3px rgba(30,35,70,.08),0 4px 14px rgba(30,35,70,.06)}
.tj1{--tr:29,78,216}.tj2{--tr:96,165,250}.ta1{--tr:109,40,217}.ta2{--tr:167,139,250}
@media(prefers-color-scheme:dark){:root{--bg:#0e1120;--s1:#181c30;--s2:#222744;--t1:#e8eaf7;--t2:#a2a8c3;--bd:#2d3354;--ac:#8d95ff;--acb:#272d57;--btxt:#0e1120;--wn:#f0c36a;--wnb:#3b2f12;--ok:#7fd9a2;--okb:#17301f;--dg:#ff9b93;--dgb:#3d1c19;--pu:#c3a4ff;--pub:#2c2140;--sh:0 1px 3px rgba(0,0,0,.4)}.tj1{--tr:76,125,255}.tj2{--tr:140,190,255}.ta1{--tr:150,105,255}.ta2{--tr:196,175,255}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t1);font:15px/1.55 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:84px}
#top{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#4338ca,#7c3aed);color:#fff;display:flex;align-items:center;gap:8px;padding:6px 12px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(60,40,140,.25)}
#top>b{font-size:17px;letter-spacing:.5px}
#top .sub{color:rgba(255,255,255,.8)}
#top .btn{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.3)}
#nav{display:flex;gap:2px;overflow-x:auto;flex:1}
#nav button{border:0;background:transparent;color:rgba(255,255,255,.75);padding:10px 14px;min-height:44px;white-space:nowrap;cursor:pointer;font:inherit;border-bottom:3px solid transparent}
#nav button.on{color:#fff;font-weight:700;border-bottom-color:#fff}
@media(max-width:759px){#nav{position:fixed;left:0;right:0;bottom:0;background:var(--s1);border-top:1px solid var(--bd);z-index:30;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 14px rgba(30,35,70,.08)}#nav button{border-bottom:0;border-top:3px solid transparent;flex:1;min-width:62px;padding:8px 4px;font-size:13px;color:var(--t2)}#nav button.on{color:var(--ac);border-top-color:var(--ac)}}
main{max-width:1400px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.card.wn{background:var(--wnb);border-color:var(--wn)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp{justify-content:space-between}
.sub{color:var(--t2);font-size:13px}
button,select,input,textarea{font:inherit;color:var(--t1)}
.btn{min-height:44px;padding:8px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--s1);cursor:pointer}
.btn.pri{background:var(--ac);color:var(--btxt);border-color:var(--ac);font-weight:600}
.btn.sm{min-height:38px;padding:4px 11px;font-size:13px}
.btn.on{background:var(--acb);color:var(--ac);border-color:var(--ac);font-weight:600}
.btn:disabled{opacity:.45}
input,select,textarea{min-height:44px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--s1);font-size:16px;max-width:100%}
textarea{width:100%;min-height:110px;font-family:ui-monospace,monospace;font-size:13px}
.bd{display:inline-block;font-size:12px;padding:1px 7px;border-radius:6px;background:var(--s2);color:var(--t2);white-space:nowrap}
.bd.w{background:var(--wnb);color:var(--wn)}.bd.o{background:var(--okb);color:var(--ok)}.bd.a{background:var(--acb);color:var(--ac)}.bd.p{background:var(--pub);color:var(--pu)}.bd.d{background:var(--dgb);color:var(--dg)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mt{background:var(--s2);border-radius:12px;padding:10px 12px}.mt .v{font-size:24px;font-weight:700}
.sumrow{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}
.tcard{border:1px solid var(--bd);border-left:6px solid rgb(var(--tr));border-radius:14px;padding:10px 12px;background:linear-gradient(135deg,rgba(var(--tr),.16),var(--s1) 72%);cursor:pointer;box-shadow:var(--sh)}
.tcard.sel{box-shadow:0 0 0 3px rgb(var(--tr))}
.tcard .big{font-size:27px;font-weight:700;line-height:1.1;margin:4px 0}
.kv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--t2)}.kv b{color:var(--t1)}
.dotc{display:inline-block;width:12px;height:12px;border-radius:50%;background:rgb(var(--tr))}
.mlist{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.mcard{position:relative;overflow:hidden;border:1px solid var(--bd);border-radius:12px;padding:8px 11px;cursor:pointer;background:var(--s1);min-height:76px}
.mcard.wr{border-color:var(--wn)}
.mcard .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(var(--tr),.34)}
.mcard .avgm{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed rgba(var(--tr),.95)}
.mcard>*:not(.bar):not(.avgm){position:relative}
.mcard .n{font-weight:600;font-size:15px}.mcard .rk{display:inline-block;min-width:22px;font-size:12px;color:var(--t2);font-weight:400}
.pb{height:8px;border-radius:4px;background:var(--s2);position:relative}.pb i{display:block;height:100%;border-radius:4px;background:rgb(var(--tr,79,70,229))}.pb i.lo{background:var(--wn)}.pb b{position:absolute;top:-3px;bottom:-3px;border-left:1px solid var(--t2)}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:center;padding:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bd);cursor:pointer;margin:0 3px}.dot.on{background:var(--ac)}
.hb{display:flex;align-items:center;gap:6px;margin:6px 0}.hb .l{width:100px;font-size:12px;color:var(--t2);flex:none}.hb .tr{flex:1;height:12px;background:var(--s2);border-radius:4px;position:relative;display:flex;overflow:hidden}.hb .tr i{display:block;height:100%;background:rgb(var(--tr));opacity:.85}
.dbt{position:relative;height:26px;margin:4px 0;background:linear-gradient(var(--bd),var(--bd)) center/100% 2px no-repeat}
.dbt i{position:absolute;display:block}
.dbt .gp{top:8px;height:10px;border-radius:5px;background:rgba(var(--tr),.45)}
.dbt .dav{top:6px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--s1);border:3px solid rgb(var(--tr))}
.dbt .dhd{top:6px;width:14px;height:14px;margin-left:-7px;transform:rotate(45deg);background:rgb(var(--tr))}
.dbt .deq{top:6px;width:14px;height:14px;margin-left:-7px;transform:rotate(45deg);border:2px solid rgb(var(--tr));opacity:.85}
.tabsb{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
h3{margin:0 0 6px;font-size:16px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none}
#sh{position:fixed;z-index:51;background:var(--s1);border:1px solid var(--bd);padding:14px;display:none;overflow:auto}
@media(max-width:759px){#sh{left:0;right:0;bottom:0;max-height:82vh;border-radius:18px 18px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}}
@media(min-width:760px){#sh{top:0;right:0;bottom:0;width:360px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:70px;z-index:60;background:var(--t1);color:var(--s1);padding:10px 16px;border-radius:10px;display:none;max-width:90vw}
</style></head>
<body><div id="top"></div><main id="main"><div class="card">載入中…</div></main><div id="ov"></div><div id="sh"></div><div id="toast"></div><datalist id="plist"></datalist>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SELF=new URLSearchParams(location.search).get('v')==='self';
let S=null,UNIT='億';
const UI={scr:'board',adm:'overview',team:null,fold:{},sort:'power',base:'all',cm:'cur',sheet:null,chart:0,zone:{},prev:null,imp:null,att:'all',selfQ:'',selfRes:null,report:false,mt:null,err:'',saved:'',undo:[],mp:null,csv:'',url:'',bk:'',rk:'',cfgAt:0};
const NAV=[['board','分隊板'],['mission','任務'],['att','點名'],['self','盟友查詢'],['admin','後台設定']];
const ADM=[['overview','總覽'],['import','匯入'],['fix','修正'],['rules','規則'],['backup','備份']];
const DEF=()=>({seq:1,players:{},alias:{},draft:{},autoLinks:[],rules:{together:[],locks:{},alts:[],exc:{}},pend:[],snaps:[],events:[],pub:null,req:[],
 ev:{id:'e'+Date.now(),name:'兵工廠',type:'foundry',min:15,max:30,K:5,mode:'m',pri:'jQt',unit:'auto',
  teams:[{id:'j1',lg:1,al:'jQt',on:true,tm:'22'},{id:'a1',lg:1,al:'aQt',on:true,tm:'22'},{id:'j2',lg:2,al:'jQt',on:true,tm:'20'},{id:'a2',lg:2,al:'aQt',on:true,tm:'20'}],final:null,att:{},attDone:false,mo:{}}});
const Store={async get(k){try{if(window.storage){const r=await window.storage.get(k);if(r&&r.value)return JSON.parse(r.value)}}catch(e){}return null},
 async set(k,v){try{if(window.storage){await window.storage.set(k,JSON.stringify(v));return true}}catch(e){}return false}};
const cfgOf=()=>({at:Date.now(),rules:S.rules,cfg:{teams:E().teams,min:E().min,max:E().max,K:E().K,mode:E().mode,pri:E().pri,unit:E().unit}});
function applyCfg(c){if(!c)return;if(c.rules)S.rules=JSON.parse(JSON.stringify(c.rules));if(c.cfg)Object.assign(S.ev,JSON.parse(JSON.stringify(c.cfg)))}
async function saveCfg(){const ok=await Store.set('roster-cfg',cfgOf());if(ok){UI.cfgAt=Date.now();const e=$('#cfgat');if(e)e.textContent=new Date(UI.cfgAt).toLocaleString()}return ok}
function migrate(){const d=DEF();Object.keys(d).forEach(k=>{if(S[k]===undefined)S[k]=d[k]});Object.keys(d.ev).forEach(k=>{if(S.ev[k]===undefined)S.ev[k]=d.ev[k]});S.ev.teams.forEach(t=>{if(!t.tm)t.tm=(S.ev.lt&&S.ev.lt[t.lg])||(t.lg===1?'22':'20')})}
let svT=null;function save(){clearTimeout(svT);UI.saved='儲存中…';stat();svT=setTimeout(async()=>{const ok=await Store.set('roster-state',S);UI.saved=ok?'已儲存':'此環境無法儲存，請用備份';stat();saveCfg()},400)}
function stat(){const e=$('#stat');if(e)e.textContent=UI.saved}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',3200)}
function mut(fn,msg){UI.undo.push(JSON.stringify(S));if(UI.undo.length>10)UI.undo.shift();fn();norm();save();if(msg)toast(msg);render()}
function undo(){const j=UI.undo.pop();if(!j)return toast('沒有可復原的步驟');S=JSON.parse(j);save();render();toast('已復原')}
const E=()=>S.ev,eff=p=>p.man||p.intent||'none',tOn=()=>E().teams.filter(t=>t.on),tById=id=>E().teams.find(t=>t.id===id);
const tLabel=t=>t.al+' 軍團'+(t.lg===1?'一':'二'),tTime=t=>t.tm==='22'?'晚上 10 點':'晚上 8 點',tc=t=>'t'+(t.al==='jQt'?'j':'a')+t.lg;
function unitOf(){const m=E().unit||'auto';if(m!=='auto')return m;let mx=0;Object.values(S.players).forEach(p=>{if(p.power>mx)mx=p.power});return mx>=1e8?'億':mx>=1e4?'萬':'原始'}
const UD=()=>({'億':1e8,'萬':1e4,'原始':1}[UNIT]||1);
const f1=x=>(Math.round(x*10)/10).toFixed(1),f2=x=>(Math.round(x*100)/100).toFixed(2);
const nf=v=>{const a=Math.abs(v);return a>=100?Math.round(v).toLocaleString():a>=10?v.toFixed(1):v.toFixed(2)};
const fmt=x=>x>0?nf(x/UD())+(UNIT==='原始'?'':' '+UNIT):'戰力不明';
const axf=v=>{if(UNIT!=='原始')return nf(v/UD());const a=Math.abs(v);return a>=1e6?nf(v/1e6)+'M':a>=1e3?nf(v/1e3)+'k':String(Math.round(v))};
const sc=s=>String(s==null?'':s).replace(/[\u200B-\u200D\uFEFF\u00A0]/g,'').trim();
const SC={'乐':'樂','鸭':'鴨','关':'關','国':'國','门':'門','线':'線','马':'馬','龙':'龍','风':'風','云':'雲','爱':'愛','电':'電','时':'時','杀':'殺','际':'際','师':'師','团':'團','战':'戰','钱':'錢','宝':'寶','兰':'蘭','罗':'羅','们':'們','这':'這','说':'說','学':'學','红':'紅','点':'點','头':'頭','军':'軍','妈':'媽','热':'熱','对':'對','来':'來','会':'會','万':'萬','东':'東','长':'長'};
function nz(s){return String(s||'').normalize('NFKC').replace(/[\u200B-\u200D\uFEFF\uFE0F\u00A0]/g,'').replace(/[\u4e00-\u9fff]/g,c=>SC[c]||c).toLowerCase().replace(/[^\p{L}\p{N}]/gu,'')}
function sim(a,b){if(!a||!b)return 0;if(a===b)return 1;if(a.length<2||b.length<2)return 0;const g=s=>{const m={};for(let i=0;i<s.length-1;i++){const k=s.substr(i,2);m[k]=(m[k]||0)+1}return m};const x=g(a),y=g(b);let n=0;for(const k in x)if(y[k])n+=Math.min(x[k],y[k]);let r=2*n/(a.length+b.length-2);const sh=a.length<b.length?a:b,lo=a.length<b.length?b:a;if(sh.length>=3&&lo.includes(sh))r=Math.max(r,.8);return r}
const AB=['不克','無法','請假','不參加','未參加','沒空','不來','不參戰'];
function pInt(s){s=sc(s);if(!s)return'none';if(AB.some(k=>s.includes(k)))return'out';const a=/軍團一|一團|22/.test(s),b=/軍團二|二團|20/.test(s);if(a&&b)return'none';if(a)return'1';if(b)return'2';return'none'}
function csv(t){t=String(t||'').replace(/^\uFEFF/,'');const d=((t.split(/\r?\n/)[0]||'').match(/\t/g)||[]).length>=2?'\t':',';const R=[];let r=[],v='',q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(c==='"'){if(q&&n==='"'){v+='"';i++}else q=!q}else if(c===d&&!q){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;r.push(v);if(r.length>1||r[0]!=='')R.push(r);r=[];v=''}else v+=c}if(v||r.length){r.push(v);R.push(r)}return R}
function detect(h){const H=h.map(sc);const pick=(ex,ks,bad)=>{let i=H.findIndex(x=>ex.includes(x));if(i<0)i=H.findIndex(x=>!(bad||[]).some(b=>x.includes(b))&&ks.some(k=>x.toLowerCase().includes(k)));return i};return{name:pick(['玩家名稱'],['名稱','name','暱稱','玩家','成員']),intent:pick(['參戰意願'],['意願','選項','option','報名']),al:pick(['聯盟'],['聯盟','alliance']),power:pick(['實力'],['實力','戰力','power'],['標準化','部隊'])}}
function rowsOf(T,m){const seen={},out=[];for(let i=1;i<T.length;i++){const r=T[i],name=sc(r[m.name]);if(!name)continue;const k=nz(name);if(!k||seen[k])continue;seen[k]=1;out.push({name,intent:m.intent>=0?pInt(r[m.intent]):'none',al:m.al>=0?(/aqt/i.test(r[m.al])?'aQt':/jqt/i.test(r[m.al])?'jQt':''):'',power:m.power>=0?(parseFloat(sc(r[m.power]).replace(/[,，]/g,''))||0):0})}return out}
async function fetchSheet(u){const m=u.match(/spreadsheets\/d\/(?:e\/)?([^/?#]+)/),pub=/spreadsheets\/d\/e\//.test(u),g=(u.match(/gid=(\d+)/)||[])[1],gs=g?'&gid='+g:'';let d;if(m&&pub)d=[u.replace(/\/pub(html)?.*/,'/pub?output=csv')+gs];else if(m)d=['https://docs.google.com/spreadsheets/d/'+m[1]+'/gviz/tq?tqx=out:csv'+gs,'https://docs.google.com/spreadsheets/d/'+m[1]+'/export?format=csv'+gs];else d=[u];
 const c=[...d];d.forEach(x=>{c.push('https://api.allorigins.win/raw?url='+encodeURIComponent(x));c.push('https://corsproxy.io/?'+encodeURIComponent(x))});
 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
 const one=async x=>{const r=await fetch(x,{signal:ctl.signal,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text(),h=t.trim().slice(0,100).toLowerCase();if(t.length<10||h.startsWith('<')||h.startsWith('{'))throw new Error('不是 CSV');return t};
 try{const t=await Promise.any(c.map(one));ctl.abort();return t}finally{clearTimeout(to)}}

function place(p){if(p.wait)return null;const on=id=>{const t=tById(id);return t&&t.on};if(p.fixed&&on(p.fixed))return{t:p.fixed,why:'固定'};const d=S.draft[p.id],it=eff(p);if(d&&on(d.t)&&(it==='1'||it==='2'))return d;return null}
function view(){const T=tOn(),tm={},where={},R={wait:[],out:[],none:[],nt:[]};T.forEach(t=>tm[t.id]=[]);
 Object.values(S.players).forEach(p=>{if(p.wait){R.wait.push(p);return}const pl=place(p);if(pl){tm[pl.t].push(p);where[p.id]=pl;return}const it=eff(p);if(it==='out')R.out.push(p);else if(it==='1'||it==='2')R.nt.push(p);else R.none.push(p)});
 Object.values(tm).forEach(a=>a.sort((x,y)=>y.power-x.power));['wait','out','none','nt'].forEach(k=>R[k].sort((x,y)=>y.power-x.power));return Object.assign({tm,where},R)}
function stats(a){const n=a.length,pw=a.map(p=>p.power).sort((x,y)=>y-x),tot=pw.reduce((s,x)=>s+x,0),avg=n?tot/n:0,k=Math.max(1,Math.min(E().K,Math.floor(n/3))),kk=Math.min(k,n),head=kk?pw.slice(0,kk).reduce((s,x)=>s+x,0)/kk:0;return{n,tot,avg,head,k,r:avg?head/avg:0}}
function dealLegion(TL,pool,pre,mode){const out={},arr=[...pool].sort((a,b)=>b.power-a.power),cnt={},sum={},hs={},hc={};
 TL.forEach(t=>{const pr=(pre&&pre[t.id])||[];cnt[t.id]=pr.length;sum[t.id]=pr.reduce((s,p)=>s+p.power,0);hs[t.id]=0;hc[t.id]=0});
 const put=(p,t,w)=>{out[p.id]={t,why:w};cnt[t]++;sum[t]+=p.power};
 const by=asc=>[...TL].sort((a,b)=>cnt[a.id]-cnt[b.id]||(asc?sum[a.id]-sum[b.id]:sum[b.id]-sum[a.id]))[0].id;
 if(TL.length===1){arr.forEach(p=>put(p,TL[0].id,'依投票'));return out}
 const n=arr.length+TL.reduce((s,t)=>s+cnt[t.id],0);
 if(mode==='s'){arr.forEach(p=>put(p,by(true),'S 型'))}
 else if(mode==='step'){const ord=[...TL].sort((a,b)=>(a.al===E().pri?0:1)-(b.al===E().pri?0:1)),k=ord.length,per=Math.min(E().min,Math.floor(n/k)),tg={};ord.forEach(t=>tg[t.id]=per);tg[ord[0].id]=Math.min(E().max,n-per*(k-1));let used=ord.reduce((s,t)=>s+tg[t.id],0),i=1;while(used<n){tg[ord[(i%k)||1].id]++;used++;i++}
  arr.forEach(p=>{const t=ord.find(x=>cnt[x.id]<tg[x.id])||ord[k-1];put(p,t.id,'階梯')})}
 else{const kk=Math.max(1,Math.min(E().K,Math.floor(n/TL.length/3))),head=arr.splice(0,kk*TL.length);
  head.forEach(p=>{const t=[...TL].sort((a,b)=>hc[a.id]-hc[b.id]||hs[a.id]-hs[b.id])[0].id;hc[t]++;hs[t]+=p.power;put(p,t,'M 型・頭部')});
