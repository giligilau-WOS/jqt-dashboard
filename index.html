<script>
const APP_VERSION='3.5.0';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 ev:{id:'e'+Date.now(),name:'兵工廠',type:'foundry',min:15,max:30,K:5,mode:'m',pri:'jQt',unit:'auto',
  teams:[{id:'j1',lg:1,al:'jQt',on:true,tm:'22'},{id:'a1',lg:1,al:'aQt',on:true,tm:'22'},{id:'j2',lg:2,al:'jQt',on:true,tm:'20'},{id:'a2',lg:2,al:'aQt',on:true,tm:'20'}],final:null,att:{},attDone:false,mo:{}}});
const Store=window.ROSTER_STORE||{err:'',async get(k){try{if(window.storage){const r=await window.storage.get(k);if(r&&r.value)return JSON.parse(r.value)}}catch(e){}return null},
 async set(k,v){try{if(!window.storage){this.err='這個環境沒有儲存空間。預覽環境不支援；若已部署到網站，請確認 storage.js 放在同一個資料夾';return false}const r=await window.storage.set(k,JSON.stringify(v),false);if(!r){this.err='儲存空間回傳失敗';return false}this.err='';return true}catch(e){this.err=String(e&&e.message||e);return false}}};
function applyTheme(){const p=(S&&S.theme)||'auto',dark=p==='dark'||(p==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light'}
try{const mq=matchMedia('(prefers-color-scheme: dark)'),h=()=>applyTheme();mq.addEventListener?mq.addEventListener('change',h):mq.addListener&&mq.addListener(h)}catch(e){}

function applyCfg(c){if(!c)return;if(c.theme)S.theme=c.theme;if(c.rules)S.rules=JSON.parse(JSON.stringify(c.rules));if(c.cfg)Object.assign(S.ev,JSON.parse(JSON.stringify(c.cfg)))}
async function saveCfg(){const ok=await Store.set('roster-cfg',cfgOf());if(ok){UI.cfgAt=Date.now();const e=$('#cfgat');if(e)e.textContent=new Date(UI.cfgAt).toLocaleString()}return ok}
function migrate(){const d=DEF();Object.keys(d).forEach(k=>{if(S[k]===undefined)S[k]=d[k]});Object.keys(d.ev).forEach(k=>{if(S.ev[k]===undefined)S.ev[k]=d.ev[k]});S.ev.teams.forEach(t=>{if(!t.tm)t.tm=(S.ev.lt&&S.ev.lt[t.lg])||(t.lg===1?'22':'20')})}
let svT=null;function save(){clearTimeout(svT);UI.saved='儲存中…';stat();svT=setTimeout(async()=>{const ok=await Store.set('roster-state',S);UI.saved=ok?'已儲存':'此環境無法儲存，請用備份';stat();saveCfg()},400)}
function stat(){const e=$('#stat');if(e)e.textContent=UI.saved}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',3200)}
function mut(fn,msg){UI.undo.push(JSON.stringify(S));if(UI.undo.length>10)UI.undo.shift();fn();norm();save();if(msg)toast(msg);render()}

const vnum=s=>String(s).split('.').map(x=>parseInt(x,10)||0);
function vgt(a,b){const x=vnum(a),y=vnum(b);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0}return false}
async function checkUpdate(manual){try{const base=location.href.split('#')[0].split('?')[0],r=await fetch(base+'?_c='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text(),m=t.match(new RegExp("APP_VERSION\\s*=\\s*'([0-9][^']*)'"));if(!m)throw new Error('找不到版本資訊');UI.lastCheck=Date.now();UI.updErr='';if(vgt(m[1],APP_VERSION)){UI.newVer=m[1];UI.dismissed=false;if(manual)toast('有新版本 '+m[1])}else{UI.newVer='';if(manual)toast('已是最新版本（'+APP_VERSION+'）')}}catch(e){UI.updErr=String(e&&e.message||e);if(manual)toast('無法檢查更新：'+UI.updErr)}renderBanner();if(manual)render()}
function renderBanner(){const e=$('#ban');if(!e)return;if(!UI.newVer||UI.dismissed){e.innerHTML='';return}
 e.innerHTML='<div class="card wn"><b>有新版本 '+esc(UI.newVer)+'</b> <span class="sub">（目前 '+APP_VERSION+'）</span>'+(Store.err?'<div class="sub" style="color:var(--dg)">目前無法自動儲存，更新後尚未備份的資料會消失，請先備份</div>':'<div class="sub">更新前資料已自動儲存，更新後會繼續使用</div>')+'<div class="row" style="margin-top:8px"><button class="btn pri" data-a="doUpdate">立即更新</button>'+(Store.err?'<button class="btn" data-a="adm" data-v="backup">先去備份</button>':'')+'<button class="btn" data-a="laterUpdate">稍後</button></div></div>'}
const E=()=>S.ev,eff=p=>p.man||p.intent||'none',tOn=()=>E().teams.filter(t=>t.on),tById=id=>E().teams.find(t=>t.id===id);
const tLabel=t=>t.al+' 軍團'+(t.lg===1?'一':'二'),tTime=t=>t.tm==='22'?'晚上 10 點':'晚上 8 點',tc=t=>'t'+(t.al==='jQt'?'j':'a')+t.lg;
function unitOf(){const m=E().unit||'auto';if(m!=='auto')return m;let mx=0;Object.values(S.players).forEach(p=>{if(p.power>mx)mx=p.power});return mx>=1e8?'億':mx>=1e4?'萬':'原始'}
const UD=()=>({'億':1e8,'萬':1e4,'原始':1}[UNIT]||1);
const f1=x=>(Math.round(x*10)/10).toFixed(1),f2=x=>(Math.round(x*100)/100).toFixed(2);

const fmt=x=>x>0?nf(x/UD())+(UNIT==='原始'?'':' '+UNIT):'戰力不明';
const axf=v=>{if(UNIT!=='原始')return nf(v/UD());const a=Math.abs(v);return a>=1e6?nf(v/1e6)+'M':a>=1e3?nf(v/1e3)+'k':String(Math.round(v))};
const sc=s=>String(s==null?'':s).replace(/[\u200B-\u200D\uFEFF\u00A0]/g,'').trim();
const SC={'乐':'樂','鸭':'鴨','关':'關','国':'國','门':'門','线':'線','马':'馬','龙':'龍','风':'風','云':'雲','爱':'愛','电':'電','时':'時','杀':'殺','际':'際','师':'師','团':'團','战':'戰','钱':'錢','宝':'寶','兰':'蘭','罗':'羅','们':'們','这':'這','说':'說','学':'學','红':'紅','点':'點','头':'頭','军':'軍','妈':'媽','热':'熱','对':'對','来':'來','会':'會','万':'萬','东':'東','长':'長'};
function nz(s){return String(s||'').normalize('NFKC').replace(/[\u200B-\u200D\uFEFF\uFE0F\u00A0]/g,'').replace(/[\u4e00-\u9fff]/g,c=>SC[c]||c).toLowerCase().replace(/[^\p{L}\p{N}]/gu,'')}
function sim(a,b){if(!a||!b)return 0;if(a===b)return 1;if(a.length<2||b.length<2)return 0;const g=s=>{const m={};for(let i=0;i<s.length-1;i++){const k=s.substr(i,2);m[k]=(m[k]||0)+1}return m};const x=g(a),y=g(b);let n=0;for(const k in x)if(y[k])n+=Math.min(x[k],y[k]);let r=2*n/(a.length+b.length-2);const sh=a.length<b.length?a:b,lo=a.length<b.length?b:a;if(sh.length>=3&&lo.includes(sh))r=Math.max(r,.8);return r}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.i==='selfQ')act('selfGo')});
document.addEventListener('scroll',e=>{const c=e.target;if(!c||c.id!=='car')return;const i=Math.round(c.scrollLeft/c.clientWidth);if(i!==UI.chart){UI.chart=i;document.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===i))}},true);

 return'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4338ca"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect width="512" height="512"'+(round?' rx="112"':'')+' fill="url(#g)"/>'+bar(76,280,1)+bar(152,170,.78)+bar(228,110,.55)+bar(304,170,.78)+bar(380,280,1)+'<g stroke="#fff" stroke-width="9" stroke-linecap="round"><path d="M256 140V240M212.7 165L299.3 215M299.3 165L212.7 215"/></g></svg>'}
function setIcons(){try{const u=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s),ic=(id,href,extra)=>{let e=document.getElementById(id);if(!e){e=document.createElement('link');e.id=id;document.head.appendChild(e)}Object.keys(extra||{}).forEach(k=>e.setAttribute(k,extra[k]));e.setAttribute('href',href)};
 ic('ic-fav',u(iconSvg(true)),{rel:'icon',type:'image/svg+xml'});
 const png=(svg,n)=>new Promise(res=>{const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=n;c.getContext('2d').drawImage(im,0,0,n,n);res(c.toDataURL('image/png'))}catch(e){res(null)}};im.onerror=()=>res(null);im.src=u(svg)});
 Promise.all([png(iconSvg(false),180),png(iconSvg(true),192),png(iconSvg(true),512)]).then(([a,b,c])=>{
  if(a)ic('ic-apple',a,{rel:'apple-touch-icon',sizes:'180x180'});
  if(b&&c){const base=location.origin+location.pathname,m={name:'分隊工具',short_name:'分隊工具',display:'standalone',start_url:base,scope:base.replace(/[^/]*$/,''),background_color:'#4338ca',theme_color:'#4338ca',icons:[{src:b,sizes:'192x192',type:'image/png'},{src:c,sizes:'512x512',type:'image/png'}]};try{ic('ic-man',URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'})),{rel:'manifest'})}catch(e){}}})}catch(e){}}
setIcons();
