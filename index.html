<!DOCTYPE html>
<html lang="zh-Hant" data-palette="frost">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="2611王國">
<title>2611王國 · 戰情室</title>
<style>
/* ===== 01×06 融合設計系統：極地冰原配色 × 圓潤親切版面 ===== */
:root{
  --bg:#eef4fa;--s1:#ffffff;--s2:#e5eff9;--rail:#0c2340;--rail-t:#c8def5;
  --bd:#d6e4f2;--dash:#c6daec;--t1:#0f243d;--t2:#4c6784;
  --ac:#0284c7;--ac2:#0369a1;--acb:#dff2fe;--btxt:#ffffff;
  --ok:#0d9488;--okb:#d8f5f1;--wn:#b46906;--wnb:#fef3dc;--dg:#dc2626;--dgb:#fee6e6;
  --hd:#0c2340;--hdt:#ffffff;
  --hero-bg:linear-gradient(135deg,#e7f4fe 0%,#dbeafe 100%);--hero-bd:#bae0fc;
  --shadow:0 6px 20px rgba(12,35,64,.06);--shadow-lg:0 16px 40px rgba(12,35,64,.16);
  --l0:100,116,139;--l1:2,132,199;--l2:13,148,136;
  --font:"SF Pro Rounded","Hiragino Maru Gothic ProN","PingFang TC","Microsoft JhengHei UI",ui-rounded,-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:"SF Mono","Cascadia Code","Menlo","Consolas",ui-monospace,monospace;
}
html[data-theme=dark]{
  --bg:#0a1420;--s1:#112032;--s2:#182c44;--rail:#07101b;--rail-t:#9bb8d6;
  --bd:#213854;--dash:#294466;--t1:#eaf3fc;--t2:#8faac7;
  --ac:#38bdf8;--ac2:#7dd3fc;--acb:rgba(56,189,248,.16);--btxt:#081524;
  --ok:#2dd4bf;--okb:rgba(45,212,191,.16);--wn:#fbbf24;--wnb:rgba(251,191,36,.16);--dg:#f87171;--dgb:rgba(248,113,113,.16);
  --hd:#07101b;--hdt:#eaf3fc;
  --hero-bg:linear-gradient(135deg,#122842 0%,#153456 100%);--hero-bd:#244a75;
  --shadow:0 8px 26px rgba(0,0,0,.32);--shadow-lg:0 18px 46px rgba(0,0,0,.52);
  --l0:148,163,184;--l1:56,189,248;--l2:45,212,191;
}

*{box-sizing:border-box}
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--t1);font:15px/1.55 var(--font);overflow-x:clip;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* ===== App Shell：手機底部導覽 / 桌機左側冰藍指揮欄 ===== */
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
#rail{display:none}
#col{flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:calc(96px + env(safe-area-inset-bottom))}

#top{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:8px;padding:11px 16px;background:var(--hd);color:var(--hdt);box-shadow:0 2px 12px rgba(12,35,64,.12)}
#top .brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
#top .brand small{font-size:11px;opacity:.82;font-weight:700}
#top .brand b{font-size:18px;font-weight:900;letter-spacing:.01em}
.desk-title{display:none;align-items:center;gap:10px}
.grow{flex:1}
#top .hbtn{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 11px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);color:var(--hdt);font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;transition:background .15s,transform .1s}
#top .hbtn:active{transform:scale(.97)}
#top .hbtn .dot{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#ef4444;color:#fff;font-size:11px;font-weight:900}

#main{width:100%;max-width:1180px;margin:0 auto;padding:14px 14px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
#main>*{min-width:0}

/* Mobile Bottom Nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--s1);border-top:1px solid var(--bd);padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);border-radius:22px 22px 0 0;box-shadow:0 -6px 22px rgba(12,35,64,.1)}
#nav button{min-height:52px;border:0;background:transparent;color:var(--t2);border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;font-size:12px;font-weight:700;transition:background .15s,color .15s}
#nav button .ic{font-size:17px;line-height:1}
#nav button.on{background:var(--acb);color:var(--ac);font-weight:800}

@media(min-width:960px){
  #app{flex-direction:row}
  #rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;width:236px;flex:none;background:var(--rail);color:var(--rail-t);padding:20px 14px;overflow-y:auto;z-index:26;box-shadow:2px 0 18px rgba(12,35,64,.1)}
  #rail .rhead{padding:4px 10px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px}
  #rail .rhead .tag{font-size:11px;font-weight:800;color:#7dd3fc;letter-spacing:.08em}
  #rail .rhead .title{font-size:22px;font-weight:900;color:#fff;margin-top:2px;line-height:1.2}
  #rail .rhead .greet{font-size:12.5px;opacity:.82;margin-top:4px}
  #rail .rnav{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 14px;border:0;border-radius:14px;background:transparent;color:var(--rail-t);font:inherit;font-size:14.5px;font-weight:800;text-align:left;cursor:pointer;transition:background .15s,color .15s}
  #rail .rnav:hover{background:rgba(255,255,255,.08)}
  #rail .rnav.on{background:var(--ac);color:var(--btxt)}
  #rail .rfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
  #rail .rgift{padding:12px;border-radius:16px;background:rgba(255,255,255,.08);font-size:12.5px}
  #rail .rgift button{width:100%;margin-top:8px;min-height:38px;border:1px solid rgba(125,211,252,.35);border-radius:12px;background:rgba(56,189,248,.18);color:#fff;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
  #col{padding-bottom:32px}
  #top{background:var(--s1);color:var(--t1);border-bottom:1px solid var(--bd);box-shadow:none;padding:12px 24px}
  #top .brand{display:none}
  .desk-title{display:flex}
  #top .hbtn{border-color:var(--bd);background:var(--s2);color:var(--t1)}
  #top .hbtn.accent{background:var(--acb);color:var(--ac);border-color:transparent}
  #main{padding:20px 24px 32px;gap:16px}
  #nav{display:none}
}

/* ===== Cards, Hero & Typography ===== */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:16px;box-shadow:var(--shadow);overflow-wrap:anywhere}
.card.tight{padding:12px 14px}
.card h3{margin:0 0 6px;font-size:16.5px;font-weight:800;line-height:1.3}
.sub{font-size:13px;color:var(--t2)}
.hero{background:var(--hero-bg);border:1px solid var(--hero-bd);border-radius:22px;padding:16px 18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.hero .htag{font-size:12px;font-weight:800;color:var(--ac)}
.hero .htitle{font-size:16.5px;font-weight:900;margin-top:2px;line-height:1.3}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}

/* KPI Metrics */
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 99px 99px 0;background:var(--kc,var(--ac))}
.kpi .in{padding-left:6px}
.kpi .v{font-size:21px;font-weight:900;line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums}
.mt{background:var(--s2);border-radius:14px;padding:10px 12px}
.mt .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}

/* ===== Friendly 44px Buttons & Segmented Controls ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--bd);background:var(--s1);color:var(--t1);border-radius:14px;padding:0 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;min-height:42px;transition:transform .1s,background .15s,border-color .15s,opacity .15s;white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.sm{padding:0 11px;font-size:12.5px;min-height:36px;border-radius:12px}
.btn.pri,.btn.on{background:var(--ac);color:var(--btxt);border-color:var(--ac)}
.btn.soft{background:var(--acb);color:var(--ac);border-color:transparent}
.btn.dg{background:var(--dgb);color:var(--dg);border:1.5px solid var(--dg)}
.btn.dg-on{background:var(--dg);color:#fff;border-color:var(--dg)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.seg{display:inline-flex;gap:3px;padding:4px;border-radius:16px;background:var(--s2);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;color:var(--t2);border-radius:12px;padding:0 13px;min-height:36px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.seg button.on{background:var(--s1);color:var(--ac);box-shadow:0 2px 8px rgba(12,35,64,.08)}

input,select,textarea{font:inherit;font-size:15px;color:var(--t1);background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:9px 12px;min-height:42px;min-width:0;max-width:100%;outline:none;transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);background:var(--s1)}
textarea{width:100%;min-height:130px;line-height:1.55}

/* Badges & Progress Bars */
.bd{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--s2);color:var(--t2);white-space:nowrap}
.bd.a{background:var(--acb);color:var(--ac)}
.bd.ok{background:var(--okb);color:var(--ok)}
.bd.w{background:var(--wnb);color:var(--wn)}
.bd.d{background:var(--dgb);color:var(--dg)}
.l0{--lc:var(--l0)}.l1{--lc:var(--l1)}.l2{--lc:var(--l2)}
.lgb{display:inline-flex;align-items:center;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;color:var(--btxt);background:rgb(var(--lc));white-space:nowrap}
.btn.lgbtn{border:1.5px solid rgb(var(--lc));color:rgb(var(--lc));background:var(--s1);font-weight:800}
.btn.lgbtn.on{background:rgb(var(--lc));color:var(--btxt)}

.pbar{display:flex;gap:5px;height:8px;margin:6px 0 4px}
.pbar .segm{background:rgba(128,128,128,.2);border-radius:99px;overflow:hidden}
.pbar .segm>i{display:block;height:100%;border-radius:99px;transition:width .25s ease}

/* ===== Roster Cards & Virtualized Table ===== */
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:11px}
.pcard{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .12s}
.pcard:hover{border-color:var(--ac)}
.pcard.bsel,.pcard.hl{border:2px solid var(--ac);background:var(--acb)}
.pcard .av{width:40px;height:40px;flex:none;border-radius:14px;background:var(--acb);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.pcard .av.alt{background:var(--okb);color:var(--ok)}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:9px;border-top:1px dashed var(--dash)}

.tw{overflow:auto;max-height:66vh;border:1px solid var(--bd);border-radius:20px;background:var(--s1);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
.pt{border-collapse:separate;border-spacing:0;min-width:100%}
.pt th,.pt td{padding:0 13px;height:44px;white-space:nowrap;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.pt th.num,.pt td.num{text-align:right;font-variant-numeric:tabular-nums}
.pt th{position:sticky;top:0;background:var(--s2);z-index:2;cursor:pointer;font-weight:800;font-size:12.5px;color:var(--t2)}
.pt td.nm,.pt th.nm{position:sticky;left:0;background:var(--s1);z-index:1;max-width:44vw;overflow:hidden;text-overflow:ellipsis;font-weight:800;box-shadow:4px 0 10px -5px rgba(12,35,64,.16)}
.pt th.nm{background:var(--s2);z-index:3;color:var(--t1)}
.pt tbody tr{cursor:pointer}
.pt tbody tr:hover td{background:var(--s2)}
.pt tr.hl td,.pt tr.bsel td{background:var(--acb)}
.pt th.fl{color:var(--ac)}

/* Rows & Autocomplete */
.ln{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 4px;border-bottom:1px dashed var(--dash)}
.ln:last-child{border-bottom:0}
.ln .fit{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .rt{flex:none}
.wr{cursor:pointer;border-radius:10px;padding-left:8px;padding-right:8px;transition:background .12s}
.wr.wsel{background:var(--acb)}
.sug{border:1px solid var(--bd);border-radius:16px;background:var(--s1);margin-top:8px;overflow:hidden;box-shadow:var(--shadow)}
.sg{padding:11px 14px;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--dash);cursor:pointer}
.sg:last-child{border-bottom:0}
.sg:hover{background:var(--s2)}

/* ===== Floating Toolbars & Top Toast (Zero Collision!) ===== */
.ftb{position:fixed;left:12px;right:12px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:35;background:var(--s1);border:2px solid var(--ac);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow-lg)}
@media(min-width:960px){.ftb{left:260px;right:24px;bottom:20px;max-width:920px;margin:0 auto}}

#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-10px);background:#0c2340;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;max-width:90vw;font-size:13.5px;font-weight:800;box-shadow:0 10px 28px rgba(0,0,0,.28);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== Sheet (Mobile Bottom Sheet / Desktop Right Slide-Over Drawer) ===== */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.on{display:block}
#sheet .bk{position:absolute;inset:0;background:rgba(8,18,32,.48);backdrop-filter:blur(2px)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-lg);animation:shUp .18s ease-out}
#sheet .handle{width:42px;height:5px;border-radius:99px;background:var(--bd);margin:0 auto 2px;flex:none}
@keyframes shUp{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
@media(min-width:760px){
  #sheet .pn{left:auto;right:0;top:0;bottom:0;max-height:none;width:490px;max-width:92vw;border-radius:24px 0 0 24px;padding:20px 22px 28px;animation:shLeft .18s ease-out}
  #sheet .handle{display:none}
  @keyframes shLeft{from{transform:translateX(28px);opacity:.7}to{transform:translateX(0);opacity:1}}
}

/* Skeleton Loader */
.sk{height:16px;border-radius:99px;background:linear-gradient(90deg,var(--s2) 25%,var(--bd) 50%,var(--s2) 75%);background-size:200% 100%;animation:shm 1.3s infinite}
@keyframes shm{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div id="app">
  <aside id="rail"></aside>
  <div id="col">
    <header id="top"></header>
    <main id="main"></main>
  </div>
</div>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="toast"></div>
<script src="config.js"></script>
<script>
'use strict';
const APP_VERSION='8.0.0';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nz=s=>String(s==null?'':s).normalize('NFKC').toLowerCase().replace(/[\s\p{P}\p{S}]+/gu,'');
function fmtP(n){n=Number(n)||0;if(n>=1e8)return(n/1e8).toFixed(2)+' 億';if(n>=1e4)return Math.round(n/1e4).toLocaleString()+' 萬';return String(n)}
const dlt=v=>v==null?'<span class="sub">—</span>':v>0?`<span style="color:var(--ok);font-weight:800">▲ ${fmtP(v)}</span>`:v<0?`<span style="color:var(--dg);font-weight:800">▼ ${fmtP(-v)}</span>`:'<span class="sub">0</span>';
const fmtT=ms=>new Date(ms).toLocaleString('zh-TW',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
const toLocalIn=iso=>{if(!iso||isNaN(Date.parse(iso)))return'';const d=new Date(iso),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())};
const todayStr=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}
function copyText(s){const fb=()=>{const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('已複製到剪貼簿')}catch(e){toast('複製失敗，請手動選取')}a.remove()};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(()=>toast('已複製到剪貼簿'),fb);else fb()}

/* ===== 活動與常數設定 ===== */
const EV=[['foundry','兵工廠','聯盟內活動'],['canyon','峽谷會戰','聯盟內活動'],['sfc','太陽城','聯盟間活動'],['tal','雪域兵器聯賽','王國間活動'],['frost','霜龍霸主','王國間活動']];
const EVN={},EVS={foundry:'兵工',canyon:'峽谷',sfc:'太陽',tal:'雪域',frost:'霜龍'};
EV.forEach(e=>{EVN[e[0]]=e[1]});
const INNER=['foundry','canyon'];
const CAP={
  foundry:{n:80,legs:2,m:30,s:10,t:'每聯盟最多 2 個軍團，每軍團正選 30 + 候補 10，熔爐 16 級以上'},
  canyon:{n:80,legs:2,m:30,s:10,t:'每聯盟最多 2 個軍團，每軍團正選 30 + 候補 10，至少 15 人才能配對'},
  sfc:{n:0,legs:1,m:0,s:0,t:'州內每個聯盟都能參加，沒有名額上限'},
  tal:{n:100,legs:2,m:30,s:20,t:'最多 2 個軍團，每軍團正選 30 + 候補 20，名單報名後鎖定'},
  frost:{n:60,legs:1,m:60,s:0,t:'最多派 60 人，報名階段後才加入聯盟的人失格'}
};
const CHN={'1':'軍團一','2':'軍團二','in':'參加','out':'不克參加'};
const SG=[['loh','英雄之地'],['cave','魔物洞穴'],['charm','魅力礦場'],['rc','研究中心'],['forge','裝備鍛造'],['gaia','蓋亞之心']];
const DLG=[['inner','聯盟內活動（兵工廠、峽谷會戰）',['foundry','canyon']],['sfc','太陽城',['sfc']],['tal','雪域兵器聯賽',['tal']],['frost','霜龍霸主',['frost']]];
const GRP={foundry:['10點鐘','5點鐘','2點鐘','7點鐘'],canyon:['左路','中路','右路']};
const ERR={

async function apiGet(params){
  if(!CFG.url)throw new Error('NOURL');
  const q=Object.assign({token:CFG.token||'',_:Date.now()},params);
  const u=CFG.url+(CFG.url.includes('?')?'&':'?')+Object.entries(q).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),30000);
  try{
    const r=await fetch(u,{cache:'no-store',signal:ctl.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j.status==='forbidden')throw new Error('連結的密碼不正確');
    if(j.status==='error')throw new Error(j.message);
    return j;
  }catch(e){throw new Error(e.name==='AbortError'?'連線逾時，請稍後再試':e.message)}
  finally{clearTimeout(to)}
}
async function apiPost(body,authOverride){
  if(!CFG.url)throw new Error('NOURL');
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),30000);
  try{
    const r=await fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token:CFG.token||''},authOverride||authBody(),body)),signal:ctl.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){throw new Error(e.name==='AbortError'?'連線逾時，請稍後再試（可能已經送出，請重新整理確認）':e.message)}
  finally{clearTimeout(to)}
}

function passF(r){
  if(BM.on&&bmReady()&&!bmInScope(r))return false;
  for(const k in P.filt){
    const c=colOf(k),f=P.filt[k];if(!c)continue;const v=c.v(r);
    if(f.vals){const arr=Array.isArray(v)?v:[v];if(!arr.some(x=>f.vals.includes(String(x==null?'':x))))return false}
    else if(f.text!=null){if(!nz(v).includes(nz(f.text)))return false}
    else{if(v==null)return false;const x=v/(c.u||1);if(f.min!=null&&x<f.min)return false;if(f.max!=null&&x>f.max)return false}
  }
  return true;
}
function rebuild(){
  P.act=P.cols.map(colOf).filter(c=>c&&(!c.det||isStaff()));
  const sk=P.sort,c=colOf(sk.k)||colOf('power'),f=c.sv||c.v;
  const a=D.rows.filter(passF);
  a.sort((x,y)=>{
    const u=f(x),w=f(y);
    if(u==null&&w==null)return 0;if(u==null)return 1;if(w==null)return -1;
    return(c.t==='s'?String(u).localeCompare(String(w),'zh-Hant'):u-w)*sk.dir;
  });
  P.view=a;
}

function sparkChart(title,pts,fy){
  if(pts.length<2)return`<div class="card tight"><b>${title}</b><div class="sub" style="margin-top:4px">資料累積中（目前 ${pts.length} 筆，需至少 2 筆繪製走勢）</div></div>`;
  const W=340,H=145,L=54,R=12,T=12,B=24,vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),sp=(mx-mn)||1;
  const X=i=>L+(W-L-R)*i/(pts.length-1),Y=v=>T+(H-T-B)*(1-(v-mn)/sp);
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const area=line+` L ${X(pts.length-1).toFixed(1)} ${(H-B).toFixed(1)} L ${X(0).toFixed(1)} ${(H-B).toFixed(1)} Z`;
  const diff=vs[vs.length-1]-vs[0];
  return`<div class="card tight"><div class="row sp" style="margin-bottom:6px"><b>${title}</b><span class="sub tnum" style="font-weight:800;color:${diff>=0?'var(--ok)':'var(--dg)'}">${diff>=0?'↗ +':'↘ '}${fy(Math.abs(diff))}</span></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      <line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="var(--bd)"/><line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="var(--bd)"/>
      <path d="${area}" fill="var(--ac)" opacity=".15"/><path d="${line}" fill="none" stroke="var(--ac)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.length<=24?pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.8" fill="var(--ac)"/>`).join(''):''}
      <text x="${L-6}" y="${T+4}" text-anchor="end" font-size="10.5" fill="var(--t2)">${fy(mx)}</text>
      <text x="${L-6}" y="${H-B}" text-anchor="end" font-size="10.5" fill="var(--t2)">${fy(mn)}</text>
      <text x="${L}" y="${H-6}" font-size="10.5" fill="var(--t2)">${esc(pts[0].l)}</text>
      <text x="${W-R}" y="${H-6}" text-anchor="end" font-size="10.5" fill="var(--t2)">${esc(pts[pts.length-1].l)}</text>
    </svg></div>`;
}

async function doReg(fid,ev,choice){
  const r=D.byF[fid];if(!r)return;
  if(!canReg(ev,r))return toast('報名已截止，只有幹部可以修改');
  let play='';if(choice!=='out'&&(ev==='tal'||ev==='frost'))play=(U.tg[ev]||'').trim()||(regOf(ev,fid)||{}).play||r.al;
  try{
    const j=await apiPost({action:'register',event:ev,fid,choice,play,note:''});
    if(!j.ok)throw new Error(ERR[j.error]||j.error||'失敗');
    (D.regs[ev]=D.regs[ev]||{})[fid]={choice,play,note:'',at:new Date().toLocaleString(),by:j.by||'self'};
    toast((choice==='out'?'已取消：':'已報名：')+r.name+' → '+EVN[ev]);
  }catch(e){toast('送出失敗：'+e.message)}
  renderSheet();render();
}
async function zReg(ev,fid,v){
  const r=D.byF[fid];if(!r)return;
  const d=zDraft(ev,fid),zoned=ev!=='sfc',lk=zLocked(ev,fid),zid=zoned?(lk||d.zone):'';

    const j=await apiPost({action:'register',event:ev,fid,choice:v,play,note:'',zone:zid});

async function seSet(ev,fid,v){

    U.seArm='';
  }

async function bmSeq(p){
  let ok=0,fail=0,last='',done=0;const items=p.list.slice();
  const one=async x=>{try{const j=await apiPost({action:'register',event:p.ev,fid:x.r.fid,choice:x.choice,play:x.play||'',note:x.note||''});if(j.ok)ok++;else{fail++;last=ERR[j.error]||j.error}}catch(e){fail++;last=e.message}done++;BM.prog='處理中 '+done+'／'+items.length;const b=$('#bmgo');if(b)b.textContent=BM.prog};
  for(let i=0;i<items.length;i+=3)await Promise.all(items.slice(i,i+3).map(one));
  return{ok,fail,last};
}
async function bmGo(){
  const p=bmPlan();if(!p.list.length)return;BM.busy=true;BM.err='';BM.prog='處理中…';renderSheet();
  let ok=0,fail=0,last='';
  try{
    if(!p.cancel){
      const roles={};p.list.forEach(x=>{if(x.note)roles[x.r.fid]=x.note});let unknown=false;
      for(let i=0;i<p.list.length&&!unknown;i+=250){
        const ch=p.list.slice(i,i+250);let j;
        try{j=await apiPost({action:'regMany',event:p.ev,choice:ch[0].choice,fids:ch.map(x=>x.r.fid),roles,play:BM.f.target.trim(),force:BM.f.force})}catch(e){j={ok:false,net:e.message}}
        if(j.ok)ok+=j.n;else if(j.error==='unknown_action')unknown=true;else{fail+=ch.length;last=j.net||ERR[j.error]||j.error}
      }
      if(unknown){const r=await bmSeq(p);ok=r.ok;fail=r.fail;last=r.last}
    }else{const r=await bmSeq(p);ok=r.ok;fail=r.fail;last=r.last}
    await loadRegs();
  }catch(e){fail=p.list.length;last=e.message}
  BM.busy=false;BM.arm=false;
  if(fail){BM.err='成功 '+ok+' 人，失敗 '+fail+' 人（'+(last||'未知原因')+'）';toast('完成，但有 '+fail+' 人失敗')}
  else{BM.err='';BM.sel=new Set();closeSheet();toast((p.cancel?'已批次取消 ':'已完成批次報名 ')+ok+' 人')}
  render();if(U.sh)renderSheet();
}

    case'z_new':Z.dz={id:'',name:'',als:isAdmin()?[]:[AU.al]};Z.arm='';openSheet({kind:'zedit'});break;
    case'z_edit':{const z=zById(v);if(z){Z.dz={id:z.id,name:z.name,als:z.als.slice()};Z.arm='';openSheet({kind:'zedit'})}}break;
    case'z_addAl':if(!Z.dz.als.includes(v)){const o=Z.list.find(x=>x.id!==Z.dz.id&&x.als.includes(v));if(o)return toast(v+' 已在「'+o.name+'」');Z.dz.als.push(v)}renderSheet();break;
    case'z_delAl':Z.dz.als=Z.dz.als.filter(x=>x!==v);renderSheet();break;
    case'z_save':{const nm=(($('#zn')||{}).value||Z.dz.name||'').trim();Z.dz.name=nm;if(!nm)return toast('請輸入特區名稱');if(!Z.dz.als.length)return toast('請至少選一個聯盟');try{const j=await apiPost({action:'zoneSave',id:Z.dz.id,name:nm,als:Z.dz.als});if(!j.ok)throw new Error(zErr(j));toast('已儲存特區');closeSheet();Z.at=0;await zRefresh();render()}catch(e){toast('儲存失敗：'+e.message)}}break;
    case'z_del':{if(Z.arm!=='del'){Z.arm='del';renderSheet();toast('再按一次確認刪除特區');setTimeout(()=>{if(Z.arm==='del'){Z.arm='';if(U.sh&&U.sh.kind==='zedit')renderSheet()}},5000);return}Z.arm='';try{const j=await apiPost({action:'zoneDelete',id:Z.dz.id});if(!j.ok)throw new Error(zErr(j));toast('已刪除特區');closeSheet();Z.at=0;await zRefresh();render()}catch(e){toast('刪除失敗：'+e.message);renderSheet()}}break;
    case'z_dl':Z.dd=v;openSheet({kind:'zdl'});break;
    case'z_dlsave':{const cv=id=>{const x=(($(id)||{}).value||'').trim();return x?new Date(x).toISOString():''};try{const j=await apiPost({action:'zoneDeadline',zone:Z.dd,inner:cv('#zdi'),tal:cv('#zdt'),frost:cv('#zdf')});if(!j.ok)throw new Error(zErr(j));toast('已儲存特區截止時間');closeSheet();Z.at=0;await zRefresh();render()}catch(e){toast('儲存失敗：'+e.message)}}break;
    case'gc_how':GC.how=!GC.how;renderSheet();break;
    case'gc_copy':copyText(v);break;
    case'gc_ntc':copyText(gcNotice());break;
    case'gc_set':gcPost({action:'codeSet',code:v,status:a.dataset.s},a.dataset.s==='active'?'已公開：'+v:a.dataset.s==='expired'?'已標為過期：'+v:'已略過：'+v);break;
    case'gc_add':{const c=(($('#gcin')||{}).value||'').trim(),n=(($('#gcnote')||{}).value||'').trim();if(!/^[A-Za-z0-9]{3,30}$/.test(c))return toast(ERR.bad_code);if(await gcPost({action:'codeSet',code:c,status:'active',note:n},'已新增並公開：'+c)){GC.inp='';GC.note='';renderSheet()}}break;
    case'gc_check':toast('檢查新兌換碼中…');gcPost({action:'codeCheck'},j=>'檢查完成，新增待確認 '+(j.added||0)+' 個');break;
    case'bindOpen':U.sh.bind={pick:'',main:'self'};renderSheet();break;
    case'bindCancel':U.sh.bind=null;renderSheet();break;
    case'bindPick':U.sh.bind.pick=v;renderSheet();break;
    case'bindMain':U.sh.bind.main=v;renderSheet();break;
    case'bindGo':{const b=U.sh.bind,me=U.sh.fid;if(!b.pick)return toast('請先選另一個帳號');try{const j=await apiPost({action:'accBind',fids:[me,b.pick],main:b.main==='self'?me:b.pick});if(!j.ok)throw new Error(ERR[j.error]||j.error||'失敗');toast('已完成綁定');U.sh.bind=null;await loadAcc()}catch(e){toast('綁定失敗：'+e.message)}renderSheet()}break;
    case'unbind':{try{const j=await apiPost({action:'accUnbind',fid:v});if(!j.ok)throw new Error(ERR[j.error]||j.error||'失敗');toast('已解除綁定');await loadAcc()}catch(e){toast('失敗：'+e.message)}renderSheet()}break;
    case'lgMode':U.lgMode=v;render();break;
    case'lgPick':U.lg={fid:v};render();break;
    case'login':{const fid=U.lg&&U.lg.fid,code=($('#lgc')||{}).value||'';if(!fid)return toast('請先選擇幹部名字');if(!code)return toast('請輸入幹部密碼');doLogin({fid,code})}break;
    case'loginAdmin':{const pin=($('#lgp')||{}).value||'';if(!pin)return toast('請輸入管理員 PIN');doLogin({pin},pin)}break;
    case'logout':AU=null;Store.del('auth');U.lg=null;D.detTried=false;D.rows.forEach(r=>{delete r.dt});BM.on=false;W.plan=null;render();break;
    case'dlSet':{const t=($('#dl_'+v)||{}).value;if(!t)return toast('請先選擇日期時間');dlSave(v,new Date(t).toISOString())}break;
    case'dlNow':dlSave(v,new Date().toISOString());break;
    case'dlClear':dlSave(v,'');break;
    case'clrGo':{const evs=Object.keys(U.clr).filter(x=>U.clr[x]);if(!evs.length)return toast('請先勾選要清除的活動');if(!U.clrArm){U.clrArm=true;render();toast('危險操作確認：再按一次紅色按鈕執行清除');setTimeout(()=>{if(U.clrArm){U.clrArm=false;render()}},5000);break}U.clrArm=false;try{const j=await apiPost({action:'clearRegs',events:evs});if(!j.ok)throw new Error(ERR[j.error]||j.error||'失敗');toast('已封存並清除 '+j.rows+' 筆報名');U.clr={};await loadRegs()}catch(e){toast('清除失敗：'+e.message)}render()}break;
    case'impFill':U.impText=DEF_ACC;U.impRes=null;render();break;
    case'impCheck':{const text=($('#imp')||{}).value||U.impText||'';U.impText=text;const ok=[],bad=[];text.split(/\n/).forEach(line=>{const m=line.match(/主\s*[：:]\s*([^/／]+?)\s*[\/／]\s*小\s*[：:]\s*(.+)$/);if(!m)return;const mn=m[1].trim(),alts=m[2].split(/[、,，]/).map(s=>s.trim()).filter(Boolean),mr=findByName(mn),fids=[];if(mr)fids.push(mr.fid);else bad.push(mn);alts.forEach(x=>{const r=findByName(x);if(r){if(!fids.includes(r.fid))fids.push(r.fid)}else bad.push(x)});if(mr&&fids.length>=2)ok.push({main:mr.fid,fids,label:mn+' ← '+alts.join('、')})});U.impRes={ok,bad};render()}break;
    case'impGo':{const r=U.impRes;if(!r||!r.ok.length)return;try{const j=await apiPost({action:'accImport',groups:r.ok.map(g=>({fids:g.fids,main:g.main}))});if(!j.ok)throw new Error(ERR[j.error]||j.error||'失敗');toast('已匯入 '+j.n+' 組');U.impRes=null;await loadAcc()}catch(e){toast('匯入失敗：'+e.message)}render()}break;
    case'cfgSave':{CFG={url:($('#cfu').value||'').trim(),token:($('#cft').value||'').trim()};Store.set('cfg',CFG);toast('已儲存，重新載入中…');D.stLoaded=false;render();Promise.all([loadState(),loadRegs(),loadAcc(),zRefresh(),gcLoad()])}break;
    case'copyLink':copyText(shareLink());break;
    case'verCheck':{U.ver='檢查中…';render();try{const t=await(await fetch(location.href.split('#')[0].split('?')[0],{cache:'no-store'})).text(),m=t.match(/APP_VERSION='([^']+)'/);U.ver=m?(m[1]===APP_VERSION?'已經是最新版（v'+APP_VERSION+'）':'有新版本 v'+m[1]+'，請重新整理頁面'):'無法判斷版本'}catch(e){U.ver='檢查失敗：'+e.message}render()}break;
    /* Batch Mode */
    case'bm_on':{const cad=isCadre()&&!isAdmin();BM.on=true;BM.sel=new Set();BM.allArm=false;BM.tmp=[];BM.scope=cad?[AU.al]:null;render()}break;
    case'bm_off':BM.on=false;BM.sel=new Set();BM.scope=null;BM.allArm=false;render();break;
    case'bm_addAl':if(!BM.tmp.includes(v))BM.tmp.push(v);render();break;
    case'bm_delAl':BM.tmp=BM.tmp.filter(x=>x!==v);render();break;
    case'bm_sp':BM.tmp=['jQt','aQt'];render();break;
    case'bm_applyScope':if(!BM.tmp.length)return toast('請先選聯盟');BM.scope=BM.tmp.slice();bmClean();render();break;
    case'bm_allarm':BM.allArm=true;render();break;
    case'bm_allno':BM.allArm=false;render();break;
    case'bm_allok':BM.scope='ALL';BM.allArm=false;bmClean();render();break;
    case'bm_scope':BM.tmp=Array.isArray(BM.scope)?BM.scope.slice():[];BM.scope=null;render();break;
    case'bm_all':BM.sel=new Set(P.view.map(r=>r.fid));bmRefresh();toast('已選 '+BM.sel.size+' 人');break;
    case'bm_top':{const n=Math.max(1,Math.floor(+($('#bmn')||{}).value||BM.n));BM.n=n;BM.sel=new Set(P.view.slice(0,n).map(r=>r.fid));bmRefresh();toast('已選前 '+BM.sel.size+' 名')}break;
    case'bm_inv':P.view.forEach(r=>{if(BM.sel.has(r.fid))BM.sel.delete(r.fid);else BM.sel.add(r.fid)});bmRefresh();break;
    case'bm_none':BM.sel=new Set();bmRefresh();break;
    case'bm_open':BM.mode=v;BM.arm=false;BM.err='';openSheet({kind:'bm'});break;
    case'bm_f':BM.f[a.dataset.k]=v;BM.arm=false;renderSheet();break;
    case'bm_go':{if(BM.busy)break;if(!BM.arm){BM.arm=true;renderSheet();toast('再按一次確認執行');setTimeout(()=>{if(BM.arm){BM.arm=false;if(U.sh&&U.sh.kind==='bm')renderSheet()}},5000);break}BM.arm=false;bmGo()}break;
    /* Squads Workbench */
    case'w_zone':W.zone=v;W.home=false;render();break;
    case'w_open':W.focus=v;wLoad();break;
    case'w_back':clearTimeout(_wsv);if(W.plan)wSave(false);W.plan=null;W.home=false;W.sel=new Set();render();break;
    case'w_tab':W.tab=v;render();break;
    case'w_ev':W.cur=v;W.sel=new Set();render();break;
    case'w_pubT':W.open[v]=!W.open[v];render();break;
    case'w_pubCopy':{const p=(W.pub||[]).find(x=>x.key===v);if(p)copyText(p.report)}break;
    case'w_evtog':{const pl=W.plan,has=pl.evs.includes(v);if(has&&pl.evs.length===1)return toast('至少留一個活動');pl.evs=has?pl.evs.filter(x=>x!==v):INNER.filter(x=>pl.evs.includes(x)||x===v);if(!pl.evs.includes(W.cur))W.cur=pl.evs[0];wChanged();render()}break;
    case'w_tog':{const t=W.plan.teams[a.dataset.ev].find(x=>x.id===v);t.on=!t.on;wChanged();render()}break;
    case'w_opt':W.plan.opt[a.dataset.k]=a.dataset.k==='grp'?v==='1':v;wChanged();render();break;
    case'w_sel':{if(W.sel.has(v))W.sel.delete(v);else W.sel.add(v);a.classList.toggle('wsel');const el=$('#wtb');if(el)el.innerHTML=wToolbar()}break;
    case'w_clr':W.sel=new Set();render();break;
    case'w_act':openSheet({kind:'wact',mode:v});break;
    case'w_apply':{const pl=W.plan,ev=W.cur,m=a.dataset.m,mm=pl.manual[ev];W.sel.forEach(f=>{if(m==='move')mm[f]=v;else if(m==='lock'){if(v){pl.rules.locks[f]=v;delete mm[f]}else delete pl.rules.locks[f]}else if(m==='only'){if(v)pl.rules.only[f]=v;else delete pl.rules.only[f]}});W.sel=new Set();closeSheet();wChanged();render()}break;
    case'w_do':{const pl=W.plan,mm=pl.manual[W.cur];if(v==='grp'){if(W.sel.size<2)return toast('互斥群組至少兩人');pl.rules.groups.push([...W.sel]);toast('已建立互斥群組')}else W.sel.forEach(f=>{if(v==='wait')mm[f]='wait';else delete mm[f]});W.sel=new Set();wChanged();render()}break;
    case'w_fix':W.plan.manual[W.cur][v]=a.dataset.t;wChanged();render();break;
    case'w_resetman':wSnap('重設手動調整前');W.plan.manual[W.cur]={};wChanged();render();break;
    case'w_recruit':{const r=D.byF[v],t=W.plan.teams[W.cur].find(x=>x.id===a.dataset.t);if(!r||!t)break;if(!canReg(W.cur,r))return toast('已截止，沒有權限代報名');try{const j=await apiPost({action:'register',event:W.cur,fid:v,choice:String(t.lg),play:'',note:''});if(!j.ok)throw new Error(ERR[j.error]||j.error||'失敗');(D.regs[W.cur]=D.regs[W.cur]||{})[v]={choice:String(t.lg),play:'',note:'',at:new Date().toLocaleString(),by:'cadre'};W.plan.manual[W.cur][v]=t.id;wChanged();toast('已代報名：'+r.name)}catch(e){toast('代報名失敗：'+e.message)}render()}break;
    case'w_force':await wSave(true);render();break;
    case'w_reload':wLoad();break;
    case'wx_rmlock':delete W.plan.rules.locks[v];wChanged();render();break;
    case'wx_rmonly':delete W.plan.rules.only[v];wChanged();render();break;
    case'wx_rmgrp':W.plan.rules.groups.splice(+v,1);wChanged();render();break;
    case'wx_clrman':wSnap('清除手動調整前');W.plan.manual={foundry:{},canyon:{}};wChanged();render();break;
    case'wx_pw':W.plan.rep.power=!W.plan.rep.power;wChanged();render();break;
    case'wx_copy':copyText(W.locked[v]?W.locked[v].report:wReport(W.plan,v,W.res[v]));break;
    case'wx_share':{const t=W.locked[v]?W.locked[v].report:wReport(W.plan,v,W.res[v]);if(navigator.share)navigator.share({text:t}).catch(()=>{});else copyText(t)}break;
    case'wx_lock':{if(W.arm!==v){W.arm=v;render();toast('再按一次確認鎖定並公布');setTimeout(()=>{if(W.arm===v){W.arm='';render()}},5000);break}W.arm='';await wxLock(v)}break;
    case'wx_unlock':await wxUnlock(v);break;
    case'wx_snap':wSnap('手動存檔');wChanged();render();break;
    case'wx_restore':{const h=W.plan.hist[+v];if(!h)break;const cl=x=>JSON.parse(JSON.stringify(x));wSnap('還原前');W.plan.manual=cl(h.manual);W.plan.opt=cl(h.opt);W.plan.teams=cl(h.teams);W.plan.evs=h.evs.slice();W.cur=W.plan.evs[0];wFix(W.plan);wChanged();render()}break;
    case'wx_newround':wSnap('新一輪前');W.plan.manual={foundry:{},canyon:{}};W.plan.date=todayStr();wChanged();render();toast('已開始新一輪，常駐規則已保留');break;
  }
}

/* ===== 全域事件監聽 ===== */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-close]')){closeSheet();return}
  const a=t.closest('[data-a]');
  if(a){handleAction(a.dataset.a,a);return}
  const row=t.closest('[data-fid]');
  if(row){
    if(BM.on&&bmReady()){bmToggle(row.dataset.fid);return}
    openSheet({kind:'player',fid:row.dataset.fid,tab:'reg'});
  }
});
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(id==='qs'){const l=suggest(t.value);$('#sugq').innerHTML=nz(t.value)?sugHtml(l,'jump'):''}
  else if(id==='fsq'){const q=nz(t.value);document.querySelectorAll('#fl .fi').forEach(el=>{el.style.display=!q||el.dataset.t.includes(q)?'flex':'none'})}
  else if(id==='bq'){$('#bsug').innerHTML=nz(t.value)?sugHtml(suggest(t.value,r=>r.fid!==U.sh.fid),'bindPick'):''}
  else if(id==='lgq'){$('#lgsug').innerHTML=nz(t.value)?sugHtml(suggest(t.value,elig),'lgPick'):''}
  else if(id==='bmq'){const q=nz(t.value),l=alList().filter(([x])=>nz(x).includes(q)).slice(0,8);$('#bmqsug').innerHTML=q?(l.length?`<div class="sug">${l.map(([x,n])=>`<div class="sg" data-a="bm_addAl" data-v="${esc(x)}"><b>${esc(x)}</b><span class="sub">${n} 人</span></div>`).join('')}</div>`:'<div class="sub">找不到聯盟</div>'):''}
  else if(id==='zq'){const q=nz(t.value),l=alList().filter(([x])=>nz(x).includes(q)).slice(0,8);$('#zqsug').innerHTML=q?(l.length?`<div class="sug">${l.map(([x,n])=>`<div class="sg" data-a="z_addAl" data-v="${esc(x)}"><b>${esc(x)}</b><span class="sub">${n} 人</span></div>`).join('')}</div>`:'<div class="sub">找不到聯盟</div>'):''}
  else if(id==='zn'&&Z.dz)Z.dz.name=t.value;
  else if(id==='imp')U.impText=t.value;
  else if(id==='gcin')GC.inp=t.value;
  else if(id==='gcnote')GC.note=t.value;
  else if(t.dataset.tg)U.tg[t.dataset.tg]=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='lgsel'&&t.value){U.lg={fid:t.value};render();return}
  if(t.dataset.ck!==undefined){if(t.checked)U.pend.add(t.dataset.ck);else U.pend.delete(t.dataset.ck);return}
  if(t.dataset.clr){U.clr[t.dataset.clr]=t.checked;return}
  if(t.id==='bmsel'&&t.value){if(!BM.tmp.includes(t.value))BM.tmp.push(t.value);render();return}
  if(t.id==='bmt'){BM.f.target=t.value.trim();BM.arm=false;renderSheet();return}
  if(t.id==='bmn2'){BM.f.n=Math.max(0,Math.floor(+t.value||0));BM.arm=false;renderSheet();return}
  if(t.dataset.bmchk){BM.f[t.dataset.bmchk]=t.checked;BM.arm=false;renderSheet();return}
  if(t.id==='brm'){BR.metric=t.value;BR.prev=null;renderSheet();return}
  if(t.id==='brl'){BR.legs=Math.min(2,Math.max(1,Math.floor(+t.value||1)));BR.prev=null;renderSheet();return}
  if(t.id==='brm1'){BR.m=Math.max(0,Math.floor(+t.value||0));BR.prev=null;renderSheet();return}
  if(t.id==='brs1'){BR.s=Math.max(0,Math.floor(+t.value||0));BR.prev=null;renderSheet();return}
  if(t.id==='brf'){BR.minFurn=Math.max(0,+t.value||0);BR.prev=null;renderSheet();return}
  if(t.id==='brt'){BR.target=t.value.trim();BR.prev=null;return}
  if(t.id==='brsel'&&t.value){if(!BR.als.includes(t.value))BR.als.push(t.value);BR.prev=null;renderSheet();return}
  if(t.id==='zsel'&&t.value&&Z.dz){const v=t.value,o=Z.list.find(x=>x.id!==Z.dz.id&&x.als.includes(v));if(o){toast(v+' 已在「'+o.name+'」');t.value='';return}if(!Z.dz.als.includes(v))Z.dz.als.push(v);renderSheet();return}
  if(t.dataset.zsel){const[ev,fid]=t.dataset.zsel.split('|');zDraft(ev,fid).zone=t.value;renderSheet();return}
  if(t.dataset.zt){const[ev,fid]=t.dataset.zt.split('|'),v=t.value.trim();if(v&&!alList().some(x=>x[0]===v)){toast('找不到「'+v+'」，請從選單選擇');t.value=zDraft(ev,fid).target;return}zDraft(ev,fid).target=v;return}
  if(t.dataset.wtime&&W.plan){const s=t.dataset.wtime,i=s.indexOf('|'),ev=s.slice(0,i),id=s.slice(i+1),tm=W.plan.teams[ev].find(x=>x.id===id);if(tm){tm.time=t.value;wChanged();render()}return}
  if(t.dataset.wopt&&W.plan){const n=+t.value;if(!isNaN(n)&&n>=0){W.plan.opt[t.dataset.wopt]=n;wChanged();render()}return}
  if(t.dataset.wdate!==undefined&&W.plan){W.plan.date=t.value;wChanged();render()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&U.sh){closeSheet();return}
  if(e.key==='Enter'&&e.target.id==='qs'){const l=suggest(e.target.value);if(l.length)jump(l[0].fid)}
});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(U.theme==='auto'){applyTheme();renderHeaderAndRail()}})}catch(e){}

(async function init(){
  render();
  if(!CFG.url){D.stErr='NOURL';D.stLoaded=true;render();return}
  await Promise.all([loadState(),loadRegs(),loadAcc(),zRefresh(),gcLoad()]);
})();
</script>
