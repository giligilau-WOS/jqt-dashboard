<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="2611王國">
<title>2611王國</title>
<style>
:root{--bg:#f4f5fb;--s1:#fff;--s2:#eef0f8;--bd:#dfe2ef;--t1:#1b1f3a;--t2:#5d6485;--ac:#4f46e5;--acb:#e6e4ff;--ok:#15803d;--dg:#dc2626;--dgb:#fde8e8;--wn:#9a5b00;--wnb:#fff1d0;--btxt:#fff;--l0:120,126,145;--l1:124,58,237;--l2:13,148,136}
html[data-theme=dark]{--bg:#0e1120;--s1:#171b30;--s2:#1f2440;--bd:#2c3256;--t1:#e8ebff;--t2:#9aa2c8;--ac:#8b86ff;--acb:#2a2860;--ok:#4ade80;--dg:#f87171;--dgb:#3a1d24;--wn:#fbbf24;--wnb:#3a2e12;--btxt:#0e1120;--l0:160,166,185;--l1:167,139,250;--l2:45,212,191}
*{box-sizing:border-box}
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--t1);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding-bottom:124px;overflow-x:clip}
#top{display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff}
#top b{font-size:18px}.grow{flex:1}
#main{max-width:1200px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
#main>*{min-width:0}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;overflow-wrap:anywhere}
.card h3{margin:0 0 6px;font-size:16px}
.sub{font-size:13px;color:var(--t2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
.btn{border:1px solid var(--bd);background:var(--s1);color:var(--t1);border-radius:10px;padding:9px 14px;font-size:15px;cursor:pointer;min-height:40px}
.btn.sm{padding:6px 10px;font-size:13px;min-height:32px}
.btn.pri,.btn.on{background:var(--ac);color:var(--btxt);border-color:var(--ac)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:16px;color:var(--t1);background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;min-width:0;max-width:100%}
textarea{width:100%;min-height:120px}
.bd{display:inline-block;font-size:12px;padding:1px 8px;border-radius:6px;background:var(--s2);color:var(--t2)}
.bd.a{background:var(--acb);color:var(--ac)}.bd.w{background:var(--wnb);color:var(--wn)}.bd.d{background:var(--dgb);color:var(--dg)}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,110px),1fr))}
.mt{background:var(--s2);border-radius:10px;padding:8px 10px}
.mt .v{font-size:19px;font-weight:700}
.tabsb{display:flex;gap:6px;overflow-x:auto}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;background:var(--s1);border-top:1px solid var(--bd);padding:6px 6px calc(env(safe-area-inset-bottom) + 14px);z-index:30;border-radius:18px 18px 0 0;box-shadow:0 -4px 14px rgba(30,35,70,.1)}
#nav button{flex:1;min-width:0;min-height:58px;margin-top:2px;border:0;background:transparent;color:var(--t2);font-size:14px;border-radius:12px;cursor:pointer;line-height:1.2}
#nav button.on{background:var(--acb);color:var(--ac);font-weight:700}
.tw{overflow:auto;max-height:68vh;border:1px solid var(--bd);border-radius:12px;background:var(--s1);-webkit-overflow-scrolling:touch}
.pt{border-collapse:separate;border-spacing:0;min-width:100%}
.pt th,.pt td{padding:0 12px;height:40px;white-space:nowrap;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.pt th{position:sticky;top:0;background:var(--s2);z-index:2;cursor:pointer;font-weight:600}
.pt td.nm,.pt th.nm{position:sticky;left:0;background:var(--s1);z-index:1;max-width:40vw;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pt th.nm{background:var(--s2);z-index:3}
.pt tbody tr{cursor:pointer}
.pt tr.hl td{background:var(--acb)}
.pt th.fl{color:var(--ac)}
.sug{border:1px solid var(--bd);border-radius:12px;background:var(--s1);margin-top:6px;overflow:hidden}
.sg{padding:12px 14px;min-height:46px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd);cursor:pointer}
.sg:last-child{border-bottom:0}
.l0{--lc:var(--l0)}.l1{--lc:var(--l1)}.l2{--lc:var(--l2)}
.lgb{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:6px;color:var(--btxt);background:rgb(var(--lc))}
.btn.lgbtn{border:2px solid rgb(var(--lc));color:rgb(var(--lc));font-weight:700}
.btn.lgbtn.on{background:rgb(var(--lc));color:var(--btxt)}
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.on{display:block}
#sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:12px}
@media(min-width:760px){#sheet .pn{left:50%;transform:translateX(-50%);width:640px;bottom:4vh;border-radius:18px}}
#toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:88vw;font-size:14px}
#toast.on{opacity:1}
</style>
</head>
<body>
<header id="top"></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="toast"></div>
<script src="config.js"></script>
<script>
'use strict';
const APP_VERSION='7.0.0';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nz=s=>String(s==null?'':s).normalize('NFKC').toLowerCase().replace(/[\s\p{P}\p{S}]+/gu,'');
function fmtP(n){n=Number(n)||0;if(n>=1e8)return(n/1e8).toFixed(2)+' 億';if(n>=1e4)return Math.round(n/1e4).toLocaleString()+' 萬';return String(n)}
const dlt=v=>v==null?'<span class="sub">—</span>':v>0?`<span style="color:var(--ok)">▲ ${fmtP(v)}</span>`:v<0?`<span style="color:var(--dg)">▼ ${fmtP(-v)}</span>`:'<span class="sub">0</span>';
const fmtT=ms=>new Date(ms).toLocaleString('zh-TW',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
const toLocalIn=iso=>{const d=new Date(iso),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}
function copyText(s){const fb=()=>{const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('已複製')}catch(e){toast('複製失敗，請手動選取')}a.remove()};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(()=>toast('已複製'),fb);else fb()}

/* ===== 活動設定 ===== */
const EV=[['foundry','兵工廠','聯盟內活動'],['canyon','峽谷會戰','聯盟內活動'],['sfc','太陽城','聯盟間活動'],['tal','雪域兵器聯賽','王國間活動'],['frost','霜龍霸主','王國間活動']];
const EVN={};EV.forEach(e=>{EVN[e[0]]=e[1]});
const INNER=['foundry','canyon'];
const CAP={foundry:{n:80,t:'每聯盟最多 2 個軍團，每軍團 30 正選 + 10 候補，熔爐 16 級以上'},canyon:{n:80,t:'每聯盟最多 2 個軍團，每軍團 30 正選 + 10 候補，至少 15 人才能配對'},sfc:{n:0,t:'州內每個聯盟都能參加，沒有名額上限'},tal:{n:100,t:'每軍團 30 正選 + 20 候補，最多 2 個軍團，名單報名後鎖定'},frost:{n:60,t:'最多派 60 人，報名階段後才加入聯盟的人失格'}};
const CHN={'1':'軍團一','2':'軍團二','in':'參加','out':'不克參加'};
const SG=[['loh','英雄之地'],['cave','魔物洞穴'],['charm','魅力礦場'],['rc','研究中心'],['forge','裝備鍛造'],['gaia','蓋亞之心']];
const DLG=[['inner','聯盟內活動（兵工廠、峽谷會戰）',['foundry','canyon']],['sfc','太陽城',['sfc']],['tal','雪域兵器聯賽',['tal']],['frost','霜龍霸主',['frost']]];
const ERR={closed:'報名已截止，一般玩家無法變更',unknown_fid:'名冊裡找不到這個人',forbidden:'連結的密碼不正確',forbidden_staff:'需要幹部或管理員登入',forbidden_admin:'需要管理員',bad_fields:'資料不完整',bad_login:'名字或密碼不正確，或你不是 R4／R5'};
const DEF_ACC='主：主流兔 / 小：盟浪兔、兔仔子\n主：冬來冬往 / 小：小冬冬\n主：劼吉撈 / 小：乂Oo煞气ㄟ屁孩oO乂\n主：Masaorange / 小：小馬殺、小馬哥\n主：小螞蟻 / 小：小小螞蟻\n主：快樂永伴 / 小：HappyHappy\n主：一念關山 / 小：一念觀山\n主：PekingDuck / 小：北京烤鸭\n主：YI9908zh / 小：Yi2\n主：周星星 / 小：麻麻豆豆~\n主：錢包包 / 小：錢多多\n主：Rueiii / 小：小梅幾';

/* ===== 儲存、連線、登入 ===== */
const Store={get(k,d){try{const v=localStorage.getItem('k2611-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('k2611-'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('k2611-'+k)}catch(e){}}};
const QP=new URLSearchParams(location.search);
let CFG=Store.get('cfg',{url:'',token:''});const BUILTIN={url:'',token:''}; /* 想把連線直接寫進網頁：把 Apps Script 網址貼在 url 的引號裡 */ const DEFC=window.K2611_CFG||BUILTIN;if(DEFC.url)CFG={url:DEFC.url,token:DEFC.token||''};
if(QP.get('api')){CFG={url:QP.get('api'),token:QP.get('t')||''};Store.set('cfg',CFG)}
let AU=Store.get('auth',null);
const isAdmin=()=>!!AU&&AU.role==='admin',isCadre=()=>!!AU&&AU.role==='cadre',isStaff=()=>!!AU;
const authBody=()=>!AU?{}:AU.role==='admin'?{pin:AU.pin}:{fid:AU.fid,code:AU.code};
async function apiGet(params){if(!CFG.url)throw new Error('NOURL');const q=Object.assign({token:CFG.token||'',_:Date.now()},params),u=CFG.url+(CFG.url.includes('?')?'&':'?')+Object.entries(q).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&'),ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),30000);
 try{const r=await fetch(u,{cache:'no-store',signal:ctl.signal});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(j.status==='forbidden')throw new Error('連結的密碼不正確');if(j.status==='error')throw new Error(j.message);return j}
 catch(e){throw new Error(e.name==='AbortError'?'連線逾時，請稍後再試':e.message)}finally{clearTimeout(to)}}
async function apiPost(body,authOverride){if(!CFG.url)throw new Error('NOURL');const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),30000);
 try{const r=await fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token:CFG.token||''},authOverride||authBody(),body)),signal:ctl.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
 catch(e){throw new Error(e.name==='AbortError'?'連線逾時，請稍後再試（可能已經送出，請重新整理確認）':e.message)}finally{clearTimeout(to)}}

/* ===== 資料 ===== */
const D={rows:[],byF:{},regs:{},acc:[],accOf:{},card:{},dls:{},meta:{},off:0,updatedAt:'',stLoaded:false,stBusy:false,stErr:'',detTried:false};
const U={tab:'players',theme:Store.get('theme','auto'),sh:null,sg:{},clr:{},tg:{},pend:new Set()};
const P={sort:{k:'power',dir:-1},filt:{},cols:Store.get('cols',['al','rk','power','furn','kills','d7','reg']),view:[],act:[],hl:''};
const nowS=()=>Date.now()+D.off;
const regOf=(ev,f)=>(D.regs[ev]||{})[f];
const closed=ev=>{const d=D.dls[ev];return !!d&&Date.parse(d)<=nowS()};
function remain(ev){const d=Date.parse(D.dls[ev]);if(!d)return'';const s=Math.max(0,Math.floor((d-nowS())/1000)),dd=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(dd?dd+' 天 ':'')+h+' 小時 '+m+' 分'}
const canReg=(ev,r)=>!closed(ev)||isAdmin()||(isCadre()&&INNER.includes(ev)&&r.al===AU.al);
const regTok=f=>{const t=EV.filter(e=>{const g=regOf(e[0],f);return g&&g.choice!=='out'}).map(e=>e[1]);return t.length?t:['未報名']};
const regCount=f=>EV.filter(e=>{const g=regOf(e[0],f);return g&&g.choice!=='out'}).length;
const chips=f=>EV.map(([k,l])=>{const g=regOf(k,f);if(!g||g.choice==='out')return'';return`<span class="${g.choice==='1'||g.choice==='2'?'lgb l'+g.choice:'bd a'}" style="margin-right:3px">${l.slice(0,1)}</span>`}).join('')||'<span class="sub">—</span>';
function mapDt(a){const st={},g=x=>x===''||x==null?null:Number(x);SG.forEach(([k],i)=>{const b=3+i*3;st[k]={l:String(a[b]||''),n:a[b+1]===''||a[b+1]==null?0:Number(a[b+1])||0,r:g(a[b+2])}});return{vip:Number(a[0])||0,lab:Number(a[1])||0,labR:g(a[2]),st,pr:g(a[21]),kr:g(a[22]),fr:g(a[23]),ts:Number(a[24])||0,tsR:g(a[25]),d:String(a[26]||'')}}
function syncMeta(j){if(j.now)D.off=Number(j.now)-Date.now();if(j.deadlines)D.dls=j.deadlines}
async function loadState(){D.stBusy=true;D.stErr='';try{const j=await apiGet({action:'state'});if(j.status!=='ok')throw new Error(j.status==='empty'?'名冊還沒有資料，請幹部先在 Apps Script 執行 syncStateRoster':'回傳格式不正確');
  const n=x=>x===''||x==null?null:Number(x);D.rows=j.rows.map(a=>({fid:String(a[0]),name:String(a[1]==null?'':a[1]),al:String(a[2]||''),rk:String(a[3]||''),power:+a[4]||0,furn:+a[5]||0,kills:+a[6]||0,src:String(a[7]||''),d1:n(a[8]),d7:n(a[9]),rkN:+a[10]||0}));
  D.byF={};D.rows.forEach(r=>{D.byF[r.fid]=r});D.meta=j.meta||{};D.updatedAt=String(j.updatedAt||'');syncMeta(j);D.detTried=false}
 catch(e){D.stErr=e.message}D.stBusy=false;D.stLoaded=true;afterLoad();if(!D.stErr&&isStaff())loadDetail()}
async function loadRegs(){try{const j=await apiGet({action:'regsall'});D.regs=j.regs||{};syncMeta(j)}catch(e){if(e.message!=='NOURL')D.regsErr=e.message}afterLoad()}
async function loadAcc(){try{const j=await apiGet({action:'accounts'});D.acc=j.groups||[];D.accOf={};D.acc.forEach(g=>g.members.forEach(m=>{D.accOf[m.fid]=g}))}catch(e){}afterLoad()}
async function loadDetail(){if(D.detTried||!D.rows.length)return;D.detTried=true;try{const j=await apiGet({action:'stdetail'}),d=j.details||{};D.rows.forEach(r=>{if(d[r.fid])r.dt=mapDt(d[r.fid])})}catch(e){}afterLoad()}
async function loadCard(fid){if(D.card[fid]&&D.card[fid]!=='err')return;D.card[fid]='load';try{D.card[fid]=await apiGet({action:'card',fid})}catch(e){D.card[fid]='err'}if(U.sh&&U.sh.fid===fid)renderSheet()}
function afterLoad(){render();if(U.sh)renderSheet()}

/* ===== 表格欄位 ===== */
const rkc=(k,l)=>({k,l,t:'n',asc:1,det:1,v:r=>r.dt?r.dt[k]:null,d:r=>r.dt&&r.dt[k]?'#'+r.dt[k]:'—'});
const NAMECOL={k:'name',l:'名稱',t:'s',asc:1,v:r=>r.name};
const COLS=[
 {k:'al',l:'聯盟',t:'s',asc:1,v:r=>r.al||'（無聯盟）',d:r=>esc(r.al||'—')},
 {k:'rk',l:'階級',t:'s',asc:1,v:r=>r.rk||'—',d:r=>esc(r.rk||'—')},
 {k:'power',l:'戰力',t:'n',u:1e8,ul:'億',v:r=>r.power,d:r=>fmtP(r.power)},
 {k:'furn',l:'熔爐',t:'n',v:r=>r.furn,d:r=>r.furn||'—'},
 {k:'kills',l:'擊殺',t:'n',u:1e4,ul:'萬',v:r=>r.kills,d:r=>r.kills?Math.round(r.kills/1e4).toLocaleString()+' 萬':'—'},
 {k:'d1',l:'日增',t:'n',u:1e4,ul:'萬',v:r=>r.d1,d:r=>dlt(r.d1)},
 {k:'d7',l:'7日增',t:'n',u:1e4,ul:'萬',v:r=>r.d7,d:r=>dlt(r.d7)},
 {k:'reg',l:'報名',t:'s',v:r=>regTok(r.fid),sv:r=>regCount(r.fid),d:r=>chips(r.fid)},
 {k:'vip',l:'VIP',t:'n',det:1,v:r=>r.dt?r.dt.vip:null,d:r=>r.dt?r.dt.vip:'—'},
 {k:'lab',l:'迷宮',t:'n',det:1,v:r=>r.dt?r.dt.lab:null,d:r=>r.dt?r.dt.lab.toLocaleString():'—'}
].concat(SG.map(([k,l])=>({k,l,t:'n',det:1,v:r=>r.dt?r.dt.st[k].n:null,d:r=>r.dt&&r.dt.st[k].l?r.dt.st[k].l:'—'})),[rkc('pr','戰力排名'),rkc('kr','擊殺排名'),rkc('fr','熔爐排名'),{k:'ts',l:'遷服積分',t:'n',det:1,v:r=>r.dt?r.dt.ts:null,d:r=>r.dt?r.dt.ts.toLocaleString():'—'}]);
const colOf=k=>k==='name'?NAMECOL:COLS.find(c=>c.k===k);
function passF(r){for(const k in P.filt){const c=colOf(k),f=P.filt[k];if(!c)continue;const v=c.v(r);
 if(f.vals){const arr=Array.isArray(v)?v:[v];if(!arr.some(x=>f.vals.includes(String(x==null?'':x))))return false}
 else if(f.text!=null){if(!nz(v).includes(nz(f.text)))return false}
 else{if(v==null)return false;const x=v/(c.u||1);if(f.min!=null&&x<f.min)return false;if(f.max!=null&&x>f.max)return false}}return true}
function rebuild(){P.act=P.cols.map(colOf).filter(c=>c&&(!c.det||isStaff()));const sk=P.sort,c=colOf(sk.k)||colOf('power'),f=c.sv||c.v;
 const a=D.rows.filter(passF);a.sort((x,y)=>{const u=f(x),w=f(y);if(u==null&&w==null)return 0;if(u==null)return 1;if(w==null)return -1;return(c.t==='s'?String(u).localeCompare(String(w),'zh-Hant'):u-w)*sk.dir});P.view=a}
function uniq(c){const m={};D.rows.forEach(r=>{const v=c.v(r),arr=Array.isArray(v)?v:[v];arr.forEach(x=>{const s=String(x==null?'':x);m[s]=(m[s]||0)+1})});return Object.keys(m).sort((a,b)=>m[b]-m[a]||a.localeCompare(b)).map(k=>[k,m[k]])}
function fdesc(k){const f=P.filt[k];if(f.vals)return f.vals.slice(0,3).join('、')+(f.vals.length>3?'…（'+f.vals.length+'）':'');if(f.text!=null)return f.text;return(f.min!=null?f.min:'')+'～'+(f.max!=null?f.max:'')}
const RH=40;
function rowHtml(r){return`<tr data-fid="${r.fid}"${P.hl===r.fid?' class="hl"':''}><td class="nm">${esc(r.name)}</td>${P.act.map(c=>`<td>${c.d(r)}</td>`).join('')}</tr>`}
function drawRows(){const box=$('#tw'),tb=$('#ptb');if(!box||!tb)return;const rows=P.view,n=rows.length,cs=P.act.length+1,st=Math.max(0,Math.floor(box.scrollTop/RH)-8),en=Math.min(n,st+Math.ceil(box.clientHeight/RH)+16);

const GRP={foundry:['10點鐘','5點鐘','2點鐘','7點鐘'],canyon:['左路','中路','右路']};
const planKey=(ev,als)=>ev+'|'+als.slice().sort().join('+');

async function loadPlan(){const als=EL.als.slice();if(!als.length)return toast('請先選聯盟');EL.busy=true;EL.msg='';render();const key=planKey(EL.ev,als);
 try{await loadRegs();const j=await apiGet({action:'plan',key});EL.key=key;let p=null;if(j.plan&&j.plan.json){try{p=JSON.parse(j.plan.json)}catch(e){}}

function evPool(pl){const m=D.regs[pl.ev]||{};return Object.keys(m).filter(f=>{const g=m[f],r=D.byF[f];return r&&(g.choice==='1'||g.choice==='2')&&pl.als.includes(r.al)}).map(f=>({r:D.byF[f],vote:m[f].choice}))}
function tmin(t){const m=String(t||'').match(/^(\d{1,2}):(\d{2})$/);return m?(+m[1])*60+(+m[2]):null}

function assignGroups(x,ev){const G=GRP[ev],n=x.list.length;if(!G||!n)return;if(ev==='foundry'){x.list.forEach((p,i)=>{const r=Math.floor(i/G.length),pos=i%G.length;p.grp=G[r%2===0?pos:G.length-1-pos]})}else{const core=Math.ceil(n*.38);x.list.forEach((p,i)=>{p.grp=i<core?'中路':((i-core)%2===0?'左路':'右路')})}}
function compute(pl){
 const T=pl.teams.filter(t=>t.on),P=evPool(pl),o=pl.opt,R=pl.rules,man=pl.manual||{},A={},why={},byT={};
 T.forEach(t=>{byT[t.id]={t,list:[],tot:0}});
 const put=(p,tid,w)=>{A[p.r.fid]=tid;why[p.r.fid]=w;if(byT[tid]){byT[tid].list.push(p);byT[tid].tot+=p.r.power}};

async function doLogin(body,pin){try{const j=await apiPost({action:'login'},body);if(!j.ok)throw new Error(ERR[j.error]||j.error||'登入失敗');
  AU=j.role==='admin'?{role:'admin',pin,name:'管理員',al:'*'}:{role:'cadre',fid:body.fid,code:body.code,name:j.name,al:j.al};Store.set('auth',AU);toast('登入成功：'+(AU.name||''));D.detTried=false;render();loadDetail()}catch(e){toast(e.message)}}
async function dlSave(group,iso){const g=DLG.find(x=>x[0]===group);try{const j=await apiPost({action:'setDeadline',events:g[2],deadline:iso});if(!j.ok)throw new Error(ERR[j.error]||j.error||'失敗');g[2].forEach(e=>{D.dls[e]=iso});toast(iso?'已設定截止：'+fmtT(Date.parse(iso)):'已重新開放報名')}catch(e){toast('失敗：'+e.message)}render()}
async function act(a,el){const v=el.dataset.v;
 switch(a){
 case'nav':U.tab=v;U.colsOpen=U.colsOpen;render();window.scrollTo(0,0);break;
 case'theme':openSheet({kind:'theme'});break;
 case'reload':D.stLoaded=false;D.card={};render();Promise.all([loadState(),loadRegs(),loadAcc()]);break;
 case'colsT':U.colsOpen=!U.colsOpen;render();break;
 case'colTog':P.cols=P.cols.includes(v)?P.cols.filter(x=>x!==v):P.cols.concat(v);Store.set('cols',P.cols);render();break;
 case'hmenu':openSheet({kind:'menu',k:v});break;
 case'sort':{const[k,d]=v.split('|');P.sort={k,dir:+d};closeSheet();render()}break;
 case'fApply':{const k=v,c=colOf(k);if(c.t==='n'){const a1=($('#fmin').value||'').trim(),b1=($('#fmax').value||'').trim(),mn=a1===''||isNaN(+a1)?null:+a1,mx=b1===''||isNaN(+b1)?null:+b1;if(mn==null&&mx==null)delete P.filt[k];else P.filt[k]={min:mn,max:mx}}
   else if(k==='name'){const t=($('#ftext').value||'').trim();if(t)P.filt[k]={text:t};else delete P.filt[k]}
   else{const all=uniq(c).map(x=>x[0]);if(U.pend.size>=all.length)delete P.filt[k];else P.filt[k]={vals:[...U.pend]}}closeSheet();render()}break;
 case'fClear':delete P.filt[v];closeSheet();render();break;
 case'fClearAll':P.filt={};render();break;
 case'fAll':document.querySelectorAll('#fl input[data-ck]').forEach(i=>{i.checked=true;U.pend.add(i.dataset.ck)});break;
 case'fNone':document.querySelectorAll('#fl input[data-ck]').forEach(i=>{i.checked=false;U.pend.delete(i.dataset.ck)});break;
 case'jump':jump(v);break;
 case'openPl':openSheet({kind:'player',fid:v,tab:'reg'});break;
 case'shTab':U.sh.tab=v;if(v==='hist')loadCard(U.sh.fid);renderSheet();break;
 case'cardRetry':delete D.card[U.sh.fid];loadCard(U.sh.fid);renderSheet();break;
 case'dm':U.dm=v;renderSheet();break;
 case'reg':doReg(U.sh.fid,el.dataset.ev,v);break;
 case'sgT':U.sg[v]=!U.sg[v];render();break;
 case'copyEv':copyText(evText(v));break;
 case'bindOpen':U.sh.bind={pick:'',main:'self'};renderSheet();break;
 case'bindCancel':U.sh.bind=null;renderSheet();break;
 case'bindPick':U.sh.bind.pick=v;renderSheet();break;
 case'bindMain':U.sh.bind.main=v;renderSheet();break;
 case'bindGo':{const b=U.sh.bind,me=U.sh.fid;if(!b.pick)return toast('請先選另一個帳號');try{const j=await apiPost({action:'accBind',fids:[me,b.pick],main:b.main==='self'?me:b.pick});if(!j.ok)throw new Error(ERR[j.error]||j.error||'失敗');toast('已綁定');U.sh.bind=null;await loadAcc()}catch(e){toast('綁定失敗：'+e.message)}renderSheet()}break;
 case'unbind':{try{const j=await apiPost({action:'accUnbind',fid:v});if(!j.ok)throw new Error(ERR[j.error]||j.error||'失敗');toast('已解除綁定');await loadAcc()}catch(e){toast('失敗：'+e.message)}renderSheet()}break;
 case'login':{const fid=U.lg&&U.lg.fid,code=($('#lgc')||{}).value||'';if(!fid)return toast('請先輸入名字並點選');if(!code)return toast('請輸入幹部密碼');doLogin({fid,code});}break;
 case'loginAdmin':{const pin=($('#lgp')||{}).value||'';if(!pin)return toast('請輸入管理員 PIN');doLogin({pin},pin)}break;
 case'logout':AU=null;Store.del('auth');U.lg=null;D.detTried=false;D.rows.forEach(r=>{delete r.dt});render();break;
 case'dlSet':{const t=($('#dl_'+v)||{}).value;if(!t)return toast('請先選擇日期時間');dlSave(v,new Date(t).toISOString())}break;
 case'dlNow':dlSave(v,new Date().toISOString());break;
 case'dlClear':dlSave(v,'');break;
 case'clrGo':{const evs=Object.keys(U.clr).filter(k=>U.clr[k]);if(!evs.length)return toast('請先勾選要清除的活動');if(!U.clrArm){U.clrArm=true;render();toast('再按一次才會清除');setTimeout(()=>{if(U.clrArm){U.clrArm=false;render()}},5000);break}
   U.clrArm=false;try{const j=await apiPost({action:'clearRegs',events:evs});if(!j.ok)throw new Error(ERR[j.error]||j.error||'失敗');toast('已封存並清除 '+j.rows+' 筆報名');U.clr={};await loadRegs()}catch(e){toast('清除失敗：'+e.message)}render()}break;
 case'impFill':U.impText=DEF_ACC;U.impRes=null;render();break;
 case'impCheck':{const text=($('#imp')||{}).value||U.impText||'';U.impText=text;const ok=[],bad=[];
   text.split(/\n/).forEach(line=>{const m=line.match(/主\s*[：:]\s*([^/／]+?)\s*[\/／]\s*小\s*[：:]\s*(.+)$/);if(!m)return;const mn=m[1].trim(),alts=m[2].split(/[、,，]/).map(s=>s.trim()).filter(Boolean),mr=findByName(mn),fids=[];
    if(mr)fids.push(mr.fid);else bad.push(mn);alts.forEach(x=>{const r=findByName(x);if(r){if(!fids.includes(r.fid))fids.push(r.fid)}else bad.push(x)});if(mr&&fids.length>=2)ok.push({main:mr.fid,fids,label:mn+' ← '+alts.join('、')})});
   U.impRes={ok,bad};render()}break;
 case'impGo':{const r=U.impRes;if(!r||!r.ok.length)return;try{const j=await apiPost({action:'accImport',groups:r.ok.map(g=>({fids:g.fids,main:g.main}))});if(!j.ok)throw new Error(ERR[j.error]||j.error||'失敗');toast('已匯入 '+j.n+' 組');U.impRes=null;await loadAcc()}catch(e){toast('匯入失敗：'+e.message)}render()}break;
 case'cfgSave':{CFG={url:($('#cfu').value||'').trim(),token:($('#cft').value||'').trim()};Store.set('cfg',CFG);toast('已儲存，重新載入資料');D.stLoaded=false;render();Promise.all([loadState(),loadRegs(),loadAcc()])}break;
 case'copyLink':copyText(shareLink());break;
 case'verCheck':{U.ver='檢查中…';render();try{const t=await (await fetch(location.href.split('#')[0].split('?')[0],{cache:'no-store'})).text(),m=t.match(/APP_VERSION='([^']+)'/);U.ver=m?(m[1]===APP_VERSION?'已經是最新版（'+APP_VERSION+'）':'有新版本 '+m[1]+'，請重新整理頁面'):'無法判斷版本'}catch(e){U.ver='檢查失敗：'+e.message}render()}break;
 }}
document.addEventListener('click',e=>{const t=e.target;
 if(t.closest('[data-close]')){closeSheet();return}
 const a=t.closest('[data-a]');
 if(a){const k=a.dataset.a;if(k==='jump'||k==='openPl'||k==='bindPick'||k==='lgPick'){}
  if(k==='cfgReset'){Store.del('cfg');CFG={url:DEFC.url||'',token:DEFC.token||''};D.stErr='';D.stLoaded=false;render();loadState();loadRegs();loadAcc();return}if(k==='lgMode'){U.lgMode=a.dataset.v;render();return}if(k==='lgPick'){U.lg={fid:a.dataset.v};render();return}
  act(k,a);return}
 const tr=t.closest('tr[data-fid]');if(tr)openSheet({kind:'player',fid:tr.dataset.fid,tab:'reg'})});
document.addEventListener('input',e=>{const t=e.target,id=t.id;
 if(id==='qs'){const l=suggest(t.value);$('#sugq').innerHTML=nz(t.value)?sugHtml(l,'jump'):''}
 else if(id==='fsq'){const q=nz(t.value);document.querySelectorAll('#fl .fi').forEach(el=>{el.style.display=!q||el.dataset.t.includes(q)?'flex':'none'})}
 else if(id==='bq'){$('#bsug').innerHTML=nz(t.value)?sugHtml(suggest(t.value,r=>r.fid!==U.sh.fid),'bindPick'):''}
 else if(id==='lgq'){$('#lgsug').innerHTML=nz(t.value)?sugHtml(suggest(t.value,elig),'lgPick'):''}
 else if(id==='imp'){U.impText=t.value}
 else if(t.dataset.tg){U.tg[t.dataset.tg]=t.value}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='lgsel'&&t.value){U.lg={fid:t.value};render();return}if(t.dataset.ck!==undefined){if(t.checked)U.pend.add(t.dataset.ck);else U.pend.delete(t.dataset.ck)}if(t.dataset.clr){U.clr[t.dataset.clr]=t.checked}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='qs'){const l=suggest(e.target.value);if(l.length)jump(l[0].fid)}});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(U.theme==='auto')applyTheme()})}catch(e){}
(async function init(){render();if(!CFG.url){D.stErr='NOURL';D.stLoaded=true;render();return}await Promise.all([loadState(),loadRegs(),loadAcc()])})();
</script>
</body>
</html>
